se\">False\u003c/span> \u003cspan class=\"explain\">- it is attached to the tectorial membrane and posterior longitudinal ligament.\u003c/span>\u003c/div>"}, {"id": "1789238899425", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">In the spine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The subarachnoid space contains about half the total volume of CSF.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The pia mater is avascular.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The three meningeal layers fuse with the periosteum of the first coccygeal segment.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The filum terminale fuses with the periosteum of the first coccygeal segment.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The dura is not seen on T 2gradient echo images.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- 75 ml out of the total 150 ml.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the pia mater is applied to the surface of the spinal cord and is vascular.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899427", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">In the blood supply to the spinal cord:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior spinal artery is formed by the union of the anterior spinal branch of each vertebral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior spinal artery supplies about two-thirds of the cord’s crosssectional area.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Radicular arteries are branches of postero-lateral spinal arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The two posterior arteries supply the posterior white matter columns and the dorsal horns of the spinal cord.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The main arterial supply to the lumbar enlargement is through the artery of Adamkiewicz. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- runs in the anterior median fissure.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the cervical region, they usually arise from branches of vertebral, deep cervical arteries, costocervical trunk or rarely from the thyrocervical branch of the subclavian. In the thoracic region they are branches of the supreme intercostal arteries and the aortic intercostal arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- also known as the arteria radicularis magna, this artery usually arises between T9 and L1 segments, from the tenth or eleventh thoracic radicular arteries. However, its origin is inconstant and paraplegia may result as a complication of aortography due to varying amounts of contrast medium being directed towards the spinal arteries via the lumbar arteries, particularly in aortic stenosis. \u003c/span>\u003c/div>"}]</script><script>
const all=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);let list=[],pos=0,only=false,marks=new Set();try{marks=new Set(JSON.parse(localStorage.getItem('manal-companion-only-review')||'[]'))}catch(e){}
const plain=s=>{let d=document.createElement('div');d.innerHTML=s;return d.textContent.toLowerCase()};all.forEach(c=>c.text=plain(c.q+' '+c.a));$('deck').append(new Option('جميع الفصول',''));[...new Set(all.map(c=>c.deck))].forEach(d=>$('deck').append(new Option(d,d)));
function filter(){const term=$('search').value.toLowerCase().trim();list=all.filter(c=>(!$('deck').value||c.deck===$('deck').value)&&(!only||marks.has(c.id))&&(!term||c.text.includes(term)));pos=0;render()}
function render(){const c=list[pos];$('count').textContent=list.length?`${pos+1} / ${list.length}`:'لا توجد بطاقات مطابقة';$('group').textContent=c?c.deck:'';$('question').innerHTML=c?c.q:'جرّب تغيير المجموعة أو عبارة البحث.';$('answer').innerHTML=c?c.a:'';$('answerBox').hidden=true;$('flip').textContent='إظهار الإجابة';$('flip').disabled=!c;$('mark').disabled=!c;$('prev').disabled=pos===0;$('next').disabled=pos>=list.length-1;$('progress').style.width=(list.length?(pos+1)/list.length*100:0)+'%';$('mark').textContent=c&&marks.has(c.id)?'★ محددة للمراجعة':'☆ أضف للمراجعة';$('mark').classList.toggle('active',!!c&&marks.has(c.id));$('only').classList.toggle('active',only)}
$('deck').onchange=filter;$('search').oninput=filter;$('flip').onclick=()=>{$('answerBox').hidden=!$('answerBox').hidden;$('flip').textContent=$('answerBox').hidden?'إظهار الإجابة':'إخفاء الإجابة'};$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(pos<list.length-1){pos++;render()}};$('shuffle').onclick=()=>{for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}pos=0;render()};$('only').onclick=()=>{only=!only;filter()};$('mark').onclick=()=>{const id=list[pos].id;marks.has(id)?marks.delete(id):marks.add(id);try{localStorage.setItem('manal-companion-only-review',JSON.stringify([...marks]))}catch(e){}if(only)filter();else{const shown=!$('answerBox').hidden;render();if(shown)$('flip').click()}};document.onkeydown=e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();if(list.length)$('flip').click()}if(e.key==='ArrowLeft')$('next').click();if(e.key==='ArrowRight')$('prev').click()};filter();
</script></body></html>
