</style></head><body><div class="manal-unified-brand">MANAL</div><main><header><div><div class="brand" dir="ltr">Manal</div><div class="subtitle">Companion · Applied Radiological Anatomy</div></div><div class="badge">247 بطاقة · 13 فصلًا</div></header><div class="toolbar"><select aria-label="المجموعة" id="deck"></select><input aria-label="بحث" id="search" placeholder="ابحث في الأسئلة والإجابات…"/></div><div class="tools"><button id="shuffle">⇄ خلط البطاقات</button><button id="only">بطاقات المراجعة فقط</button><button id="mark">☆ أضف للمراجعة</button></div><div class="status"><span id="count"></span><span dir="ltr" id="group"></span></div><div class="track"><span id="progress"></span></div><article class="card"><div class="label">QUESTION</div><div class="content" id="question"></div><section class="answer" hidden="" id="answerBox"><div class="label">ANSWER &amp; EXPLANATION</div><div class="content" id="answer"></div></section></article><div class="nav"><button id="prev">السابق</button><button class="primary" id="flip">إظهار الإجابة</button><button id="next">التالي</button></div><div class="note">المحتوى والإجابات كما وردت في ملف Anki الأصلي · تعمل الصفحة دون إنترنت<br/>الأسهم للتنقل · مفتاح المسافة لإظهار الإجابة</div></main><script id="data" type="application/json">[{"id": "1789238898935", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the imaging modalities of the chest:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>High resolution computed tomography (HRCT) uses a slice thickness of 4-6 mm to identify mass lesions in the lung.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Spiral CT ensures that no portion of the chest is missed due to variable inspiratory eﬀort.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>MRI shows excellent detail of the lung anatomy.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Bronchography is the technique of choice to visualize the bronchial tree\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>CT pulmonary angiography (CTPA) is performed using catheters placed in a femoral vein.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- HRCT uses 1-2 mm slice thickness and a high resolution computer algorithm to show fine detail of the lung parenchyma, pleura and tracheobronchial tree. It is not used to delineate masses in the lung.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- currently MRI is a poor technique for showing lung detail. It allows visualisation of the chest wall, heart, mediastinal and hilar structures.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this invasive technique has largely been superseded by HRCT.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- CTPA is performed to diagnose major pulmonary emboli using a cannula placed in any peripheral vein and is relatively non-invasive compared to conventional pulmonary angiography.\u003c/span>\u003c/div>"}, {"id": "1789238898937", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the development of the lung:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The tracheobronchial groove appears on the ventral aspect of the caudal end of the pharynx.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The primary bronchial buds develop from the tracheobronchial diverticulum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The epithelium lining the alveoli is the same before and after birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>A persistent tracheo-oesophageal fistula (TOF) is commonly associated with an atresia of the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Uni-lateral pulmonary hypoplasia is usually due to a congenital diaphragmatic hernia.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the bronchial buds diﬀerentiate into bronchi in each lung.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- during embryonic life the alveoli is lined by cuboidal epithelium that lines the rest of the respiratory tract. When respiration commences at birth the transfer to the flattened pavement epithelium of the alveoli is accomplished.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- TOF indicates the close developmental relationship between the foregut and the respiratory passages. It is usually associated with an atresia of the oesophagus and the fistula is situated below the atretic segment.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238898939", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the blood supply to the chest wall:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The posterior intercostal arteries supply the 11 intercostal spaces.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The internal thoracic artery arises from the subclavian artery and supplies the upper six intercostal spaces.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The neurovascular bundle passes around the chest wall in the subcostal groove deep to the internal intercostal muscle. 2\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The intercostal spaces are drained by two anterior veins and a single posterior intercostal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The posterior intercostal vein drains into the internal thoracic vein.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- there are usually nine pairs of posterior arteries from the postero-lateral margin of the thoracic aorta, distributed to the lower nine intercostal spaces. The first and second spaces are supplied by the superior intercostal artery, branches of the costocervical trunk from the subclavian artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- 3\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- posterior intercostal veins drain into the brachiocephalic vein and azygos system. The anterior veins drain into the musculo-phrenic and internal thoracic veins.\u003c/span>\u003c/div>"}, {"id": "1789238898941", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the azygos venous system:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The azygos vein at the level of the fourth thoracic vertebra arches over the root of the right lung to end in the superior vena cava (SVC).\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>About 10% of the population have an azygos lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The thoracic duct and aorta are to the right of the azygos vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The second, third and fourth intercostal spaces on the right, drain via the right superior intercostal vein into the azygos vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>In congenital absence of IVC the azygos vein enlarges.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in 1% of the population, the azygos vein traverses the lung before entering the SVC resulting in the azygos fissure.The azygos ‘ lobe’ is not a true segment.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are to its left.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- hemiazygos, accessory hemiazygos, oesophageal, mediastinal, pericardial and right bronchial veins drain into the azygos system.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the azygous continuation of the IVC, the azygos is a large structure, but otherwise the anatomy is unaltered. This may be confused with a mediastinal mass.\u003c/span>\u003c/div>"}, {"id": "1789238898943", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the hemiazygos and accessory hemiazygos venous systems:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The hemiazygos vein at the level of the fourth thoracic vertebra crosses the vertebral column behind the aorta, oesophagus and thoracic duct.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The ascending lumbar veins and the lower three posterior intercostal veins are the tributaries of the hemiazygos vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The accessory hemiazygos vein receives the fourth to the eighth intercostal veins on the left.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The accessory hemiazygos vein may drain into the left brachiocephalic vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The first posterior intercostal vein may drain into the corresponding vertebral vein.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- at the level of T8.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and subcostal veins of the left side, some mediastinal and oesophageal veins.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- sometimes the bronchial veins.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- through the left superior intercostal vein. It may join the hemiazygos and/or drain into the azygos vein at the level of T7.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- or the corresponding brachiocephalic vein.\u003c/span>\u003c/div>"}, {"id": "1789238898945", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the airways:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>In adults the right main-stem bronchus is steeper than the left.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The left main bronchus is about twice as long as the right.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The bronchioles contain cartilage.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Gas exchange takes place in the terminal bronchioles and acini.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The bronchopulmonary segments are based on the pulmonary arterial system. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- after 6 to 20 divisions the segmental bronchi no longer contain cartilage in their walls and become bronchioles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the terminal bronchiole is the last of the purely conducting airways, beyond which are the gas-exchange units of the lung - the acini.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- based on the divisions of the bronchi. \u003c/span>\u003c/div>"}, {"id": "1789238898947", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the secondary pulmonary lobule:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It consists of approximately ten acini.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The lobular vein follows the branches of the bronchioles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Lymph drainage is both interlobular and central along the arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Lobules are best demonstrated nearer to the hilum of the lung on CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The interlobular septa are seen usually on conventional CT.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- acini are 8-20 mm in diameter and consists of respiratory bronchioles, alveolar ducts and alveoli.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lobular artery follows the branches of the bronchioles. Peripheral veins drain the lobule and run along the interlobular septum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- lobules are surrounded by connective tissue septa which contain veins and lymphatic vessels, in the lung periphery.Therefore they are best demonstrated in the periphery of the lung.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they can just be appreciated on HRCT.\u003c/span>\u003c/div>"}, {"id": "1789238898949", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the pulmonary blood vessels:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The bronchovascular bundle of the secondary pulmonary lobule is demonstrated as a rounded density about 1 cm away from the pleural border on axial CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The inferior pulmonary veins draining the lower lobes are more vertical than the lower lobe arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The upper lobe veins lie lateral to the arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In a frontal chest radiograph the artery and bronchus of the anterior segment of the upper lobes are frequently seen end-on.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left pulmonary artery passes anterior to the left main bronchus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is true.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it arches over the left main bronchus and left upper lobe bronchus to descend postero-lateral to the left lower lobe bronchus.\u003c/span>\u003c/div>"}, {"id": "1789238898951", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the pleura:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The parietal pleura is continuous with the visceral pleura at the hilum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>On a PA radiograph the pleura is seen in the costophrenic sulcus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The parietal pleura is supplied by the pulmonary circulation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The fissures usually contain a layer of parietal and visceral pleura.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The intercostal stripe is seen on axial CT as a linear opacity of soft tissue density at the intercostal space.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and in the inferior pulmonary ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the visceral pleura can be seen on a plain radiograph only where it invaginates the lung to form fissures and at the junctional lines.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the parietal pleura is supplied by the systemic circulation, and the visceral pleura is supplied by the pulmonary and bronchial circulation.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- only two layers of visceral pleura.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- two layers of pleura, extrapleural fat, innermost intercostal muscle and endothoracic fascia.\u003c/span>\u003c/div>"}, {"id": "1789238898953", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the fissures of the lung:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Complete fissures may be crossed by small bronchovascular structures seen on HRCT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The oblique fissure separates the upper and lower lobes from the middle lobe on the right. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The lateral and medial portion of the oblique fissure are equidistant from the anterior chest wall.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The major fissures appear as a soft tissue linear density from the hilum to the chest wall on standard 10 mm thick CT sections.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The minor fissure separates the right middle lobe from the right lower lobe.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- incomplete fissures have parenchymal fusion and small bronchovascular structures.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the oblique fissure separates the upper and middle lobes from the lower lobe on the right. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the oblique fissures follow a gently curving plane. The upper portion faces forward and laterally and the lower portion forwards and medially.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the most common appearance is a curvilinear avascular band extending from the hilum to the chest wall, reflecting the lack of vessels in the subcortical zone of the lung. On HRCT, the major fissure appears as a line or a band.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the minor fissure separates the anterior segment of the right upper lobe from the right middle lobe.\u003c/span>\u003c/div>"}, {"id": "1789238898955", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the accessory fissures of the lung:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The azygos fissure results from failure of normal migration of the azygos vein from the chest wall through the lung.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The inferior accessory fissure separates the medial basal segment from the rest of the right lower lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The superior accessory fissure lies above the minor fissure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>A left minor fissure is seen in 10% of frontal radiographs.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The inferior pulmonary ligaments are pleural reflections from the pericardium.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- almost always on the right, rarely an analogous fissure may be seen on the left with the accessory hemiazygos or left superior intercostal vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- runs upward and medially towards the hilum, from the medial aspect of the diaphragm.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- superior accessory fissure separates the superior segment of the lower lobe from the basal segments and is inferior to the minor fissure on the frontal radiograph.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- left minor fissure seen in 10% of individuals is hardly seen on frontal or lateral radiographs. It separates the lingular segments from the rest of the upper lobe.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are pleural reflections that hang down from the hila and from the mediastinal surface of each lower lobe to the mediastinum and to the medial part of the diaphragm.\u003c/span>\u003c/div>"}, {"id": "1789238898957", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding blood supply of the lung:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The left bronchial artery arises from the right bronchial artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The deep bronchial veins may end in the left atrium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The right and left pulmonary arteries are at the same height in the chest.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The right upper lobe pulmonary artery is anterior to the right upper lobe bronchus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The veins of the upper lobe are posterior to the arteries and bronchi. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- bronchial arteries are variable. Usually the right bronchial artery arises from the third posterior intercostal artery or from the upper left bronchial artery. The left bronchial arteries are two in number and arise from the thoracic aorta.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the deep bronchial veins communicate freely with the pulmonary veins, end in a pulmonary vein or left atrium. The superficial bronchial veins drain extrapulmonary bronchi, visceral pleura and hilar lymph nodes, end on the right side into the azygos vein and on the left into the left superior intercostal vein or the accessory hemiazygos vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the left pulmonary artery is higher than the left as it arches over the left main bronchus and descends posterior to it.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the veins of the upper lobe are anterior to the arteries and bronchi. \u003c/span>\u003c/div>"}, {"id": "1789238898959", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">In the chest:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Air in the oesophagus on axial CT usually indicates a dilated abnormal oesophagus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>On T2-W MRI the oesophagus shows similar intensity to skeletal muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The thoracic duct transports all of the body lymph into the great veins of the neck.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The thoracic duct is mostly a single structure as it runs from the cisterna chyli.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The thoracic duct crosses from the left to the right at the level of T4.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in 80% of normal individuals the oesophagus contains a small amount of air.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- T2-W MRI reveals higher intensity than muscle. The signal intensity on T 1-W MRI is similar to that of muscle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- all but lymph of most of the lung and the right upper quadrant of the body.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it may consist of up to eight separate channels.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- at T 6, it crosses from right to left of the spine and ascends along the lateral aspect of the oesophagus and arches forward across the left subclavian artery and inserts into a large central vein within 1 cm of the junction of the left internal jugular and subclavian veins.\u003c/span>\u003c/div>"}, {"id": "1789238898961", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the mediastinal blood vessels:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The three major aortic branches from right to left are the innominate, left common carotid and left subclavian arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>In approximately 0.5% of the population the right subclavian artery arises distal to the left subclavian artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The left brachiocephalic vein is anterior to the subclavian, common carotid arteries and trachea.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal thoracic veins empty into the corresponding subclavian veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left SVC results from a persistent left cardinal vein.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the aberrant right subclavian artery runs posterior to the oesophagus from left to right.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- formed by the junction of left internal and subclavian veins.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- into the corresponding brachiocephalic veins.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in 0.3% to 0.5% of healthy population and in 4.4% to 12.9% of those with congenital heart disease. It usually drains into the coronary sinus, which then communicates with the right atrium.\u003c/span>\u003c/div>"}, {"id": "1789238898963", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">Regarding the mediastinal spaces:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pretracheal space is bounded anteriorly by the anterior junctional line.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The aortopulmonary window is above the aortic arch.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The aortopulmonary window contains the ligamentum arteriosum and the left recurrent laryngeal nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The azygo-oesophageal recess lies behind the subcarinal space.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The right paratracheal stripe extends down as far as the right tracheobronchial angle. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anteriorly the SVC or right brachiocephalic veins, ascending aorta with its enveloping superior pericardial sinus and posteriorly the trachea or carina.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- above the pulmonary artery under the aortic arch.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and fat, though this is not seen on CT due to volume averaging resulting in higher than fat density.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- air containing trachea and lung are separated by a thin layer of fat on the right, giving rise to the ‘stripe’.This is broadened at the right tracheobronchial angle by the azygous vein which lies between the airway and the lung. \u003c/span>\u003c/div>"}, {"id": "1789238898965", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">In a chest radiograph:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior junctional line is usually straight and extends to the right ventricle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior junctional line is anterior to the oesophagus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The azygo-oesophageal line is below the aortic arch.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The right paravertebral stripe is thicker than that on the left due to the azygos vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On a PA projection, the left superior intercostal vein may project lateral to the aortic arch as a small ‘nipple’.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lungs almost touch each other posterior to the oesophagus to form the posterior junction line.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the upper few centimetres are usually straight or concave towards the lung. A convex shape suggests a subcarinal mass in adults; however this may be a normal feature in children.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the left paravertebral stripe is usually wider than the right.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238898967", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">In the chest:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The thymus is usually inferior to the left brachiocephalic vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>MRI demonstrates thymic tissue better than CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The diaphragmatic crus on the right arises from the upper three lumbar vertebrae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The oesophageal hiatus lies posterior to the aortic hiatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The hiatus for the IVC is posterior to that of the aorta and oesophagus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and superior to the level of the horizontal portion of the right pulmonary artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- after puberty, the density gradually decreases owing to fatty replacement. In older patients the thymus may be indistinguishable from mediastinal fat. On T 2-W MRI the signal intensity is similar or sometimes higher than fat and does not change with age. On T1-W MRI, the intensity of normal thymic tissue is similar or slightly higher than that of muscle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- they arch upward and forward to form the margins of the aortic and oesohageal hiati.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- oesophageal hiatus lies anterior to aortic hiatus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the most anterior of the three diaphragmatic hiati is the hiatus for the IVC, which is in the central tendon immediately beneath the right atrium.\u003c/span>\u003c/div>"}, {"id": "1789238898969", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">In the development of the heart:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The primitive heart is formed by fusion of two parallel tubes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The heart tube kinks to form a U-shaped loop.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The single atrium and ventricle are separated by the dorsal and ventral endocardial cushions.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The foramen secundum is a defect in the septum secundum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The foramen ovale is due to two overlapping defects, which act like a valve. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- soon this grooves to demarcate the sinus venosus, atrium, ventricle and bulbus cordis from behind forward.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the caudal end (sinus venosus) receiving venous blood, comes to lie behind the cephalic end (which gives rise to truncus arteriosus). In the fully developed heart, the atria and great vein lie posterior to the ventricles and to the roots of the great arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- these divide the common atrio-ventricular opening into a right (tricuspid) and left (mitral) orifice.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the foramen secundum is a defect in the septum primum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the septum secundum grows to the right of septum primum, is never complete and has a lower free edge. It extends low enough to overlap the foramen secundum and closes it. Ten per cent of individuals have anatomically patent but functionally sealed foramen. \u003c/span>\u003c/div>"}, {"id": "1789238898971", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">In the heart:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The aortic root and pulmonary trunk are covered with parietal pericardium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The right atrium is anterior and to the right of the left atrium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The coronary sinus enters the right atrium on the posterior wall.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The crista terminalis demarcates the smooth from the rigid portion of the inner wall of the right atrium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The Eustachian valve directs blood flow from the IVC into the right atrium in the adult.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the Eustachian valve in fetal life serves to direct oxygenated blood from IVC into the foramen ovale. It is rudimentary in adult life.\u003c/span>\u003c/div>"}, {"id": "1789238898973", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 01", "q": "\u003cdiv class=\"stem\">In the heart:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pulmonary valve is anterior and to the right of the aortic root.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The interventricular and interatrial septa are in the same plane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The right ventricle contributes to the right cardiac border on the frontal chest radiograph.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In the right ventricle the crista supraventricularis demarcates the smooth conus from the trabeculated wall.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The moderator band carries the right bundle branch of the conducting system of the right ventricle.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterior and to the left of the aortic root.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- left anterior oblique plane.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- does not usually contribute to the cardiac outline on the frontal chest radiograph.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- crosses from the lower ventricular septum to the anterior papillary muscle.\u003c/span>\u003c/div>"}, {"id": "1789238898975", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the heart:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The left atrial auricular appendage contributes to the normal left cardiac border.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The left atrium is posterior to the oesophagus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The four pulmonary veins attach anteriorly in the left atrium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left atrium lies to the right of the aortic root.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The mitral valve is placed in the left lower anterior aspect of the left atrium.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the left atrium does not contribute to the normal cardiac outline.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- is related posteriorly to the oesophagus and left lower lobe bronchus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the four pulmonary veins are located at the upper and lower margin of the left atrium postero-laterally.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is posterior.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238898977", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In the heart:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Most of the external surface of the left ventricle is anterolateral.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The mitral valve lies in the same plane as the tricuspid valve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The mitral valve is closely related to the non-coronary and left posterior coronary sinuses. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Each anterior and posterior leaflet of the mitral valve is attached to a papillary muscle by chordae tendinae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The sinuses of valsalva are below the valve in the aortic root.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- though the left ventricle forms most of the left heart border on the frontal radiograph, most of its external portion is postero-lateral.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- right anterior oblique plane.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it has no septal attachment. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the sinuses of valsalva are just above the aortic valve in the aortic root. They are three focal dilatations. The left coronary artery arises from the left posterior sinus, and the right coronary artery arises from the anterior sinus. The right posterior sinus is the non-coronary sinus.\u003c/span>\u003c/div>"}, {"id": "1789238898979", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the coronary arteries:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Coronary dominance refers to whether the right or left vessels supply the posterior diaphragmatic portion of the interventricular septum and the diaphragmatic surface of the left ventricle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The right coronary artery runs in the atrioventricular groove.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The posterior descending artery supplies part of the inferior interventricular septum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left anterior descending artery runs in the left atrioventricular groove.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>In approximately 20% of individuals the LAD tapers before reaching the apex.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- 85% of people have right dominance.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- ultimately anastomosis with the left circumflex artery in the inferior atrioventricular groove.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the left coronary artery gives oﬀ the LAD and the left circumflex artery within one centimetre of its origin. The LAD descends in the anterior interventricular groove.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a large septal branch from the LAD may run parallel to the LAD in this case.\u003c/span>\u003c/div>"}, {"id": "1789238898981", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the coronary veins:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior cardiac veins empty into the coronary sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The great cardiac vein runs in the anterior interventricular groove.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle cardiac vein runs in the left interventricular groove.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Small cardiac veins run with the marginal branches of the right coronary artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left posterior ventricular vein accompanies the posterior descending artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the anterior cardiac veins drain the anterior surface of the right ventricle and open directly into the right atrium. The venae cordis minimae are minute vessels in the myocardium which also drain into the chambers, mainly the atria.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and becomes the coronary sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- runs in the posterior interventricular groove.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this vein accompanies the obtuse marginal branches of the left coronary artery.\u003c/span>\u003c/div>"}, {"id": "1789238898983", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the major vessels of the chest:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The aortic arch is anterior to the trachea and oesophagus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The left pulmonary artery is attached to the junction of the arch and descending aorta.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The left common carotid artery may arise from the brachiocephalic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The aortic hiatus is at the level of T12 vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The oesophagus is anteromedial to the descending aorta throughout its course. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the ligamentum arteriosum at the isthmus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- commonest variant of the major vessels (27%). The left vertebral may arise directly from the arch (2.5%) and lie between the left common carotid and subclavian arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in its upper portion the oesophagus lies to the right of the aorta. \u003c/span>\u003c/div>"}, {"id": "1789238898985", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">The superior vena cava:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>lies posterior to the right main-stem bronchus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>has direct drainage anteriorly from the azygos vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>is formed by the union of the right and left brachiocephalic veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>partly is enclosed in pericardium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>has direct drainage from the internal mammary veins.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- SVC is anterior to the right main bronchus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the azygos drains into the posterior aspect of the SVC.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the internal mammary veins drain into the corresponding brachiocephalic veins.\u003c/span>\u003c/div>"}, {"id": "1789238898987", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the pulmonary artery and vein:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The right main pulmonary artery is beneath the aortic arch.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The right superior pulmonary vein crosses the right main pulmonary artery anteriorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The left main pulmonary artery is shorter but in a higher position than that on the right.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lower lobe pulmonary veins are vertical as they approach the heart.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The pulmonary trunk bifurcates beneath the aortic arch. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and in front of the right main bronchus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the hilar point,which is seen on a frontal radiograph. The left is 1 cm higher than that on the right.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they run horizontally.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238898989", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In angiography:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The femoral artery is punctured at its point of minimal pulsation, to prevent haematoma formation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A low puncture is ideal as it decreases the chances of a retroperitoneal haematoma.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The femoral nerve lies lateral to the artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>For interventional procedures of the lower limb a retrograde puncture on the ipsilateral femoral artery is ideal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>For punctures of the brachial or axillary arteries, the right arm is usually preferred.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- point of maximal pulsation usually as it passes over the medial third of the femoral head.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a high puncture placed above the inguinal ligament may result in retroperitoneal haematoma as the artery is diﬃ cult to compress without the support of the femoral head. A low puncture may cause a pseudoaneurysm formation or arteriovenous fistula if the profunda femoris is punctured.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- so a large haematoma may compress and damage the nerve.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- an antegrade puncture, so that catheters and wires can be passed down the leg easily.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the left arm, avoids manipulation of catheters across origin of great vessels.\u003c/span>\u003c/div>"}, {"id": "1789238898991", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In angiography:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The Seldinger technique involves passing a catheter through the puncture needle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Retrograde popliteal artery puncture is useful for angioplasty of the superficial femoral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Intravenous digital subtraction angiography usually requires less iodinated contrast medium than the intra-arterial technique.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Radial artery catheterization is performed using a 5F catheter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Translumbar approach to the aorta is the best way of visualizing the aorta.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a guide wire is passed through the needle into the artery.The needle is removed and a catheter is passed over the guide wire into the artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- requires large amounts.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 3F catheters usually.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- largely abandoned nowadays, and replaced by the aortogram through the transfemoral approach.\u003c/span>\u003c/div>"}, {"id": "1789238898993", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In the upper chest:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The right subclavian artery arises directly from the arch of the aorta.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The subclavian artery lies posterior to the subclavian vein. * From Applied Radiological Anatomy:‘The limb vasculature and the lymphatic system’. 20\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The dorsal scapular artery arises from the second part of the subclavian artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The suprascapular artery arises from the thyro-cervical trunk.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The inferior thyroid artery contributes to the blood supply of the spinal cord.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- usually from the brachiocephalic trunk which divides into the right subclavian and right common carotid arteries. The left subclavian arises directly from the arch of the aorta.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and scalenus anterior muscle and ends at the lateral border of the first rib, where it continues as the axillary artery. * From Applied Radiological Anatomy:‘The limb vasculature and the lymphatic system’. 21\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and supplies muscles attached to the medial border of the scapula and takes part in the scapular anastomosis with the third part of the axillary artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and so do inferior thyroid and superficial cervical artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and so does the ascending cervical artery.\u003c/span>\u003c/div>"}, {"id": "1789238898995", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the axillary artery:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The subclavian artery continues as the axillary artery at the lateral border of teres major muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The pectoralis major muscle divides the axillary artery into three parts.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The cords of the brachial plexus are anterior to the second part of the axillary artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The subscapular artery runs downwards on the posterior axillary wall to the inferior angle of the scapula.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The third part is superficial and may be used for arterial puncture.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- lateral border of first rib to the lower border of teres major muscle is the axillary artery, after which it is the brachial artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- pectoralis minor divides it into three parts.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they surround this artery medially, laterally and posteriorly and separate it from the axillary vein which runs medially and slightly anteriorly.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and contributes to the scapular anastomosis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238898997", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the arteries of the forearm and hand:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The brachial artery divides into radial and ulnar arteries at the level of the neck of the radius.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The profunda brachi artery runs in the radial groove.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The brachial artery is superficial to the bicipital aponeurosis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The radial artery may branch oﬀ higher than the usual level.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The radial artery gives oﬀ the common interosseus artery 2 cm below its origin.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- gives branches to scapular and elbow anastomosis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- superficial throughout its course and overlapped by bicipital aponeurosis at the elbow.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- ‘high take-oﬀ’ of radial artery - a common normal variant above the neck of the radius. The deep palmar arch is a continuation of the radial artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- ulnar artery.\u003c/span>\u003c/div>"}, {"id": "1789238898999", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In the lower abdomen and pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>There are no terminal branches to the aorta.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The common iliac arteries divide at the level of the sacroiliac joints.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The common iliac arteries lie in front of the fourth and fifth lumbar vertebrae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The ureters lie anterior to the common iliac arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superior rectal artery lies anterior to the right common iliac artery. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- three; a pair of common iliac arteries and the median sacral artery anterior and to the left of the body of L4 vertebra.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- into the internal and external iliac arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- common iliac veins, lumbosacral trunk, obturator nerve, iliolumbar artery and the sympathetic trunk lie posterior to the common iliac trunk.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterior to the left common iliac artery. \u003c/span>\u003c/div>"}, {"id": "1789238899001", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In the pelvis and lower abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The superior gluteal artery is a branch of the external iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The uterine artery is a branch of the anterior division of the internal iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The umbilical artery is the first branch of the internal iliac artery in the fetus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal pudendal artery re-enters the pelvis through the lesser sciatic foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The inferior epigastric artery is given oﬀ above the inguinal ligament from the external iliac artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- largest branch of the posterior division of the internal iliac artery, passes through greater sciatic foramen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- runs in the broad ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- persists as the fibrous medial umbilical ligament, which may be recognized in a plain abdominal film in the presence of a pneumoperitoneum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- supplies the genitalia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- runs up on the deep surface of the anterior abdominal wall and enters the rectus sheath.\u003c/span>\u003c/div>"}, {"id": "1789238899003", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In the lower limb:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The main supply to the trochanteric anastomosis is through the superficial femoral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The superficial femoral artery passes lateral to and behind the lower shaft of the femur.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The popliteal artery lies lateral to the popliteal vein in the popliteal fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The descending genicular artery is a branch of the popliteal artery supplying the knee.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The anterior tibial artery runs anterior to the interosseous membrane.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this anastomosis supplies the femoral head and is formed by anastomosing branches of lateral and medial circumflex femoral and superior gluteal arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- posterior and medial to the femur, through the adductor hiatus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this artery lies deep to the popliteal vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a branch of the superficial femoral artery, prior to entering the adductor hiatus. The medial and lateral superior and inferior genicular arteries are given oﬀ in the popliteal fossa.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\
