=\"letter\">(b)\u003c/span>An aberrant renal artery may run to the kidney from the common iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Fusion of the metanephric masses across the midline results in a duplex kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Congenital absence of one kidney occurs in about one in 100 births.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The primitive urogenital sinus gives rise to the bladder, urethra and vestibule of the vagina.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- as the ureteric outgrowth lengthens, the kidney is situated more and more cranially.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- as the kidney ascends from the pelvis, it gets its blood sequentially from the middle sacral, common iliac arteries and finally from the aorta. Hence one of these arteries may persist in later life.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a horseshoe kidney. On ultrasound, diﬃ culty in defining the lower poles of the kidneys, should alert the sonographer to this variant.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 1 in 2400 births.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899145", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">In the renal tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>A high kV radiograph optimizes the detection of calcification.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Perirenal fat allows the renal outline to be seen on plain films.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ureters are projected over the tips of the transverse processes of L2 to L5.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>On tomograms the renal upper pole is posterior to the lower pole.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Prone views aid mid ureteric filling during an IVU. *F r o mApplied Radiological Anatomy: ‘The renal tract and retroperitoneum’. 80\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a low KV radiograph.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and over the sacroiliac joints, and within the pelvis over a course which runs laterally to the ischial spines and medially towards the bladder.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- due to orientation of the kidneys to the lumbar lordosis. The whole length of the kidney is seen with slight caudal angulation of the X-ray tube.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- * From Applied Radiological Anatomy: ‘The renal tract and retroperitoneum’. 81\u003c/span>\u003c/div>"}, {"id": "1789238899147", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the kidneys:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>On ultrasound of the kidney the cortex is echopoor compared with the medulla.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>On T1-W MRI the cortex is of higher signal than the medulla.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>They usually lie between T12 and L3 vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Corticomedullary diﬀerentiation is appreciated on a DMSA scan.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The upper poles lie more laterally than the lower poles.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- cortex is echopoor and medulla is echobright. This is cortico-medullary diﬀerentiation and fat within the renal sinus is very bright.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">Answer\u003c/span> \u003cspan class=\"explain\">- ).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- upper poles lie more medially and posteriorly than lower poles (see question 3\u003c/span>\u003c/div>"}, {"id": "1789238899149", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">In the kidney:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The right kidney is usually larger by about 1.5 cm than the left.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The columns of Bertin extend medially within the substance of the kidney separating the medulla into pyramids.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Compound calyces are less eﬃ cient at preventing intrarenal reflux of urine.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The renal arteries arise from the aorta at the superior margin of T12.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The right renal artery is posterior to the IVC.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and therefore are incriminated in the aetiology of reflux nephropathy (chronic pyelonephritis).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- superior margin of L2, immediately caudal to the origin of the SMA.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899151", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">In the kidney:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior division of the renal artery supplies both upper and lower portions of the kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The segmental branches divide into interlobar arteries between the pyramids.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The arcuate arteries anastomose extensively with each other at the base of the pyramids.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The renal vein is anterior to the renal pelvis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left renal vein is anterior to the aorta.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the posterior division supplies the upper and mid-portion of the posterior aspect of the kidney.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they form individual arcs which do not anastomose.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and receives the inferior phrenic vein, the gonadal and suprarenal vein on the left. There are no extra-renal tributaries to the right renal vein.\u003c/span>\u003c/div>"}, {"id": "1789238899153", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the fascial planes and spaces around the kidney:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The perirenal fat is surrounded by Gerota’s fascia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior pararenal space lies between the anterior leaf of Gerota’s fascia and the posterior peritoneum. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The posterior pararenal space lies between the kidneys and Gerota’s fascia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The two leaves of Gerota’s fascia fuse to form the lateral conal fascia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The suprarenal gland is outside the peri-renal space.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- Gerota’s fascia has an anterior and posterior leaf.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this space extends across the midline and encases the pancreas, duodenum and both ascending and descending colon. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- between the posterior leaf of Gerota’s fascia and the muscles of the posterior abdominal wall. Laterally the space is continuous with the extraperitoneal fat. Therefore, using an anterior abdominal wall incision an operation on retroperitoneal structures can be performed.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this passes lateral to the colon and medial to the posterior renal space.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- exact location is in debate (see question 10).\u003c/span>\u003c/div>"}, {"id": "1789238899155", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">The ureter:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>shows narrowing at the pelvi-ureteric junction, when it crosses the iliac vessels at the pelvic brim and at the vesico-ureteric junction.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>on the right is crossed by the second part of the duodenum, gonadal, right colic and ileocolic vessels.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>in the male passes posterior to the seminal vesicle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>in the female passes just superior to the uterine artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>from the upper moiety in complete duplication opens in an ectopic location.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and root of the mesentery and terminal ileum. As the aorta is left sided the ureter is less oblique over the right common iliac artery compared to the left. Thus a greater length of the right ureter is compressed during pregnancy leading to pyelonephritis on this side.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterosuperior to the seminal vesicle. The ureter is usually lateral to the IVC - except in a retrocaval ureter.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- inferior and here it is in danger during a hysterectomy.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the ureter from the lower moiety inserts obliquely and predisposes to reflux and that of the upper moiety leads to ureterocele and obstruction.\u003c/span>\u003c/div>"}, {"id": "1789238899157", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the urinary tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Renal duplication is commoner in females than males.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A ureterocele when associated with duplication usually aﬀects the ectopic ureter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In fetal lobulation the divisions overlie a calyx.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>A pancake kidney results from fusion of two ectopic pelvic kidneys.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A horseshoe kidney usually lies higher than the normal kidney. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- prevalence of about 2%.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a ureterocele is a dilatation of the intramural part of the ureter due to narrowing of the ureteric orifice.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in cortical scarring, the loss of cortex overlies a calyx. In fetal lobulation the divisions lie between calyces.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- pelvic kidneys derive their blood supply from the internal iliac artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- lies lower.The ascent of the horseshoe kidney is prevented by the inferior mesenteric artery. It occurs in 1 in 100 individuals.The lower pole of a normally situated kidney may fuse with the upper pole of an ectopic kidney - a crossed fused ectopia. Despite abnormal migration of the kidneys the suprarenals almost always lie in their usual sites apart from assuming a discoid shape, due to the absence of the renal impression in utero. \u003c/span>\u003c/div>"}, {"id": "1789238899159", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">The suprarenal gland(s):\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>at birth are the same size as the kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>are separated from the kidney by a thin layer of peri-renal fat and lie at the superior margin of the peri-renal fascia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>have limbs that are usually no more than the size of the adjacent diaphragmatic crus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>on the right is anterior to the IVC.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>on the left is anterior to the lesser sac.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- at birth they are about one-third the size of the kidney and atrophy until the second year of life after which slow growth occurs until pubery to reach adult size - about one-thirtieth the size of the kidney.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- posterior to the IVC and right lobe of the liver.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899161", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the suprarenal glands:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The superior suprarenal artery is a branch of the inferior phrenic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The suprarenal artery proper is a branch of the corresponding renal arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The right suprarenal vein drains into the right renal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The arteries to the suprarenal gland arise at about the level of L1/L2 intervertebral disc.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Islands of suprarenal cortical tissue may be found in the broad ligament.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a branch of the aorta, it gives rise to the middle suprarenal artery.The renal arteries give rise to the inferior suprarenal arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the left suprarenal vein drains into the left renal vein. The right suprarenal vein drains directly into the IVC.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and epididymis and spermatic cord.\u003c/span>\u003c/div>"}, {"id": "1789238899163", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">The IVC:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>is formed at the level of L5 by the confluences of the right and left common iliac veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>At the level of the diaphragm, is separated from the aorta by the right crus of the diaphragm and oesophagus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>pierces the central tendon of the diaphragm at the level of T12.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>drains the left renal vein adjacent to the uncinate process of the pancreas.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>drain the segmental lumbar veins.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- at T8.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- spread of infection or tumour from the pelvis to the vertebral column is due to the ascending lumbar veins. The ascending lumbar veins connect the segmental lumbar veins which drain the vertebral venous plexuses into the IVC, and extend as far caudally as the lateral sacral veins and iliolumbar veins.\u003c/span>\u003c/div>"}, {"id": "1789238899165", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the lymphatic system:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The internal structure of nodes can sometimes be assessed on high resolution CT. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Nodes of more than 1cm in the external iliac territory are often normal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Nodes of 1cm on short axis in the retrocrural on left gastric territories are usually abnormal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Lymphography is the method of choice to visualize the internal iliac, hepatic and pre-aortic nodes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The cisterna chyli extends from the bifurcation of the aorta to just below the diaphragm.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the internal structure of nodes can never be seen. Lymph nodes of 0.5-1cm (normal size) can be detected, but the normal nodes cannot be discerned from the abnormal ones of this size.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- these group of nodes are not visualized on lymphography. High quality CT has almost completely replaced this technique.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is 6 cm long anterior to L1 and L2 posterior to the right crus of the diaphragm. It passes through the retrocrural space with the aorta to become the thoracic duct.\u003c/span>\u003c/div>"}, {"id": "1789238899167", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the diaphragm:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>In the midline the crura join to form the lateral arcuate ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The fascia overlying the psoas muscle is thickened and gives origin to the diaphragm.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The IVC passes through the most posterior of the diaphragmatic openings.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The aorta enters the thorax anterior to the crura.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The oeosphagus passes through the muscular part of the diaphragm in the region of the right crus. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the median arcuate ligament which is a tendinous structure in the midline.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is the medial arcuate ligament. The lateral arcuate ligament is fascia overlying the quadratus lumborum muscles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the IVC pierces the central tendinous part of the diaphragm and is patent in all phases of respiration. It is the most anterior of the three openings.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the aorta passes posterior to the median arcuate ligament in the retrocrural space. The rectrocrural space is bounded laterally by the crura, anteriorly by their fused median arcuate ligament and posteriorly by the vertebral body of T12.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- at the level of T10 with the right and left vagus nerves, oesophageal branches of the left gastric vessels and lymphatics draining the lower third of the oesophagus. \u003c/span>\u003c/div>"}, {"id": "1789238899169", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Concerning the pelvic floor:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pelvic diaphragm is inferior to the superficial muscles of the perineum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The pelvic diaphragm is formed by levator ani and coccygeus muscles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The perineal aspect of the levator ani forms the medial wall of the ischiorectal fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The urogenital diaphragm is pierced by the urethra in both sexes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>To the fibromuscular perineal body attach the anal sphincter and levator ani muscles.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the pelvic diaphragm is superior to the superficial perineal muscles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and by the vagina in the female.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and transverse perineal and bulbospongiosus muscles.\u003c/span>\u003c/div>"}, {"id": "1789238899171", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Concerning the nerves of the pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The sacral plexus is anterior to the piriformis muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The sciatic nerve can be visualized by CT and MRI as it passes through the greater sciatic foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The pudendal nerve leaves the pelvis through the lesser sciatic foramen to enter the perineum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The obturator nerve runs lateral to the psoas in the pelvis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The femoral nerve passes into the thigh under the inguinal ligament.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the largest nerve in the body.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the sacrospinous ligament and the sacrotuberous ligament form the superior and postero-inferior borders of the lesser sciatic foramen, respectively. The internal pudendal artery and pudendal nerve exit the pelvis through the greater sciatic foramen and enter the perineum through the lesser sciatic foramen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it runs medial to the psoas, and then along the lateral pelvic wall, lies posteromedial to the common iliac vein to enter the obturator canal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899173", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">In the pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The umbilical artery anastomoses with the inferior epigastric artery in the adult.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The external iliac artery passes under the inguinal ligament to become the common femoral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle rectal artery is a branch of the internal pudendal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The obturator artery usually arises from the external iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A persistent sciatic artery may replace the superficial femoral artery. * From Applied Radiological Anatomy: ‘The pelvis’. 90\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the first branch of the internal iliac artery in the fetus which persists as the medial umbilical ligament. This may be recognized in the presence of pneumoperitoneum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the middle rectal artery is a branch of the anterior division of the internal iliac artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it usually arises from the anterior division of the internal iliac artery in 75% of individuals. It may arise from the inferior epigastric artery in 25%.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in less than 1% of individuals there is an enlarged inferior gluteal artery (branch of the anterior division) which represents persistent fetal vascular supply to the lower limbs. * From Applied Radiological Anatomy: ‘The pelvis’. 91\u003c/span>\u003c/div>"}, {"id": "1789238899175", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">In the pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The urachal remnant forms the median umbilical ligament passing from the apex of the bladder to the umbilicus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The neck of the bladder rests on the urogenital diaphragm in both sexes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The distal ureter is posterior to the bifurcation of the common iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The bladder is supplied by the superior and inferior vesical artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>In a plain radiograph, unilateral absence of the perivesical fat stripe is a sign of pelvic pathology.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is extraperitoneal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the female this is true. In the male, the neck of the bladder rests on the prostate.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterior.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899177", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning the bladder:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is trabeculated except at the trigone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Colour doppler enables identification of ureteric jets into the bladder.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The wall is of a high signal intensity on T 1- and T2-W MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>It has a normal wall thickness of about 3 cm.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The intramural ureter courses obliquely for about 2 cm before entering the bladder cavity.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- chemical shift artefact in the frequency-encoding direction produces a high signal within the bladder wall, which may be misleading. On both T 1- and T 2-W MRI the bladder wall is homogeneous and of a low signal intensity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 4-5 mm.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899179", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning the male urethra:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The posterior urethra is divided into the prostatic and spongy parts.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior urethra is divided into the bulbous and penile urethra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The membranous urethra runs through the external urethral sphincter within the urogenital diaphragm.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The verumontanum is a prominence in the prostatic crest into which the prostatic utricle opens.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The anterior urethra is well visualized on transrectal ultrasound.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the prostatic and membranous parts.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is 1.5 cm long, and the narrowest, most fixed and least dilatable part of the urethra. Therefore, is most prone to injury during a pelvic fracture.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the anterior urethra is visualized well by retrograde urethrography. However, the posterior urethra is visualized well by antegrade urethrography when the patient micturates contrast.\u003c/span>\u003c/div>"}, {"id": "1789238899181", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding the prostate:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior wall of the prostate lies in the arch of the pubis separated from it by retropubic space.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The paired seminal vesicles are separated from the rectum by the peripheral zone of the prostrate gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The peripheral zone of the prostate comprises 70% of the glandular tissue. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The transition zone of the prostate lies at the junction of the central and peripheral zones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The central zone surrounds the urethra just above the ejaculatory ducts.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the seminal vesicles are posterior to the prostate and are seprated from the rectum by a dense condensation of the pelvic fascia - Denonvillier’s fascia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the glandular tissue has other zones: central zone 25% and transition zone 5%. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the narrow transition zone lies just inside the central zone.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- most carcinomas arise in the peripheral zone, whereas benign prostatic hypertrophy aﬀects the transition zone.\u003c/span>\u003c/div>"}, {"id": "1789238899183", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding the male genital tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>T2-W MRI delineates the zonal anatomy of the prostate gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Fat suppressed sequences give excellent contrast between the high signal peripheral zone and the periprostatic fat.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The surgical pseudo-capsule is between the enlarged transition zone and the compressed peripheral zone, encountered with increasing age.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The central and peripheral zones are not diﬀerentiated on trans-rectal ultrasound (TRUS).\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On TRUS the seminal vesicles are very echogenic.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the normal peripheral zone has high signal intensity, and the central and transition zones have low intensity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- changes of benign prostatic hypertrophy. The pseudocapsule and the anatomical capsule are well seen on T 2-W sequences.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- TRUS shows the central and peripheral zones to be of generally low echogenicity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the seminal vesicles appear as convoluted tubules containing transonic fluid - hence they are of lower echogenicity than the prostate.\u003c/span>\u003c/div>"}, {"id": "1789238899185", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning the male genital organs:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The mediastinum of the testis is an incomplete fibrous septum posteriorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The vas deferens lies medial to the epididymis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The testicular artery is a branch of the internal pudendal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The spermatic cord contains the vas deferens, the testicular vessels, cremastric artery and genital branch of genitofemoral nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The testicular vein drains into the pampiniform plexus of veins.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- tunica albuginea is a tough fibrous capsule that forms an incomplete, thickened fibrous septum. Through this run the testicular vessels.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it arises from the aorta at the level of the renal vessels.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the artery to the vas deferens (from the inferior vesical artery), lymphatics from the testes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the pampiniform plexus of veins above and behind the testis become one single testicular vein as they approach the inguinal ring. The right testicular vein drains into the IVC and the left testicular vein drains into the left renal vein.\u003c/span>\u003c/div>"}, {"id": "1789238899187", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding the testis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The testis has homogeneous medium level echoes on ultrasound.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The mediastinum testis is a posterior and highly echogenic structure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The epididymis is slightly echopoor compared with the testis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>On T 2-W MRI the testis is either equal to or greater than that of fat.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The pampiniform plexus is of high signal on T2-W MRI. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- similar to thyroid.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- echobright and a coarser texture.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the fibrous tunica albuginea is of low signal on all sequences. On T 1-W images the testis is of uniformly medium signal less than that of fat.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are seen as signal voids. \u003c/span>\u003c/div>"}, {"id": "1789238899189", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning the female genital tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Lymphatic drainage from the upper third of the vagina is to the internal and external iliac nodes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The cavity of the uterus is triangular in the sagittal plane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The retroflexed uterus is better visualized with transabdominal ultrasound than the anteflexed uterus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In the fetus the cervix is not identified separately from the uterus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The uterine artery is a direct branch of the aorta.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the middle third to the internal iliac and the lower third to the superficial inguinal nodes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- cleft in the sagittal plane, triangular in the coronal plane.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is True\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in fetal life and childhood the cervix is larger than the body of the uterus. By adulthood, the uterine body is twice the size of the cervix.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a branch of the internal iliac artery.The ovarian artery is a direct branch of the aorta at L1/2 level.\u003c/span>\u003c/div>"}, {"id": "1789238899191", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">The following are true of the female genital tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>On T2-W MRI the junctional zone is a low signal intensity band in the submucosa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>On T1-W sequences three distinct zones are seen in the uterus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Normal ovaries are low to medium signal on T1-W MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>After gadolinium DTPA the ovarian follicles exhibit increased signal intensity.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The anatomy of the fallopian tubes are best seen by MRI.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- no submucosa exists between the endometrium and myometrium. The junctional zone represents the inner myometrium.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- on T1-W sequences the uterus has moderate to low signal intensity. On T 2-W sequences three distinct zones are seen. The endometrium and the cavity appear as a high signal stripe, bordered by a band of low signal junctional zone. The outer myometrium is of medium signal intensity which increases in midsecretory phase.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- higher signal on T 2-W MRI.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the follicles are low signal foci in surrounding high signal stroma, which enhances after intravenous gadolinium.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- by hysterosalpingography (HSG).\u003c/span>\u003c/div>"}, {"id": "1789238899193", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning the female genital tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Peritoneum covers the superior and lateral aspects of the uterus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The broad ligaments are formed by the anterior and posterior reflections of peritoneum passing over the fallopian tubes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The round ligament originates at the lateral angle of the uterus and passes to the labia major.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal iliac artery is anterior to the ovary.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Endovaginal ultrasound provides good detail of the adnexal areas. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the uterus is covered entirely by peritoneum except below the level of the internal os anteriorly and laterally between the layers of the broad ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- passes through the inguinal canal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- posterior to the ovary.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the uterus. \u003c/span>\u003c/div>"}, {"id": "1789238899195", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding the female genital tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>On T2-W MRI the cervix has an inner area of low signal intensity continuous with the junctional zone of the uterus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The use of oral contraceptives and menstrual cycle change the appearance of the cervix on MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ampulla of the fallopian tube is the funnel-shaped most lateral part.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In a bicornis bicollis variant of the uterus, there are two separate cervical canals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Contrast spillage in the peritoneal cavity is a sign of patency of fallopian tubes in a hystero-salpingogram. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- appearances do not change.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- This is the infundibulum. From lateral to medial are the infundibulum, ampulla - wide tortuous outer part; isthmus - long narrow, just lateral to the uterus; interstitial part - pierces the uterine wall.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- contrast filled tubes with extravasation definitely from the ipsilateral tube is a more reliable sign of tubal patency. Interpretation is rendered diﬃ cult when contrast pools in the peritoneal space from the contralateral tube when the ipsilateral tube is blocked. \u003c/span>\u003c/div>"}, {"id": "1789238899197", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding transabdominal ultrasound of the fetus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Doppler examinations impart less energy when compared with routine ultrasound.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>18 to 20 weeks of gestation is the optimal time to confirm intrauterine location.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Cardiac activity is seen at 5 weeks’ gestational age.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Crown rump length is a useful measurement of gestational age at 10 weeks.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The fetal pole is discernible before cardiac pulsation.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is true. In general, routine ultrasound is considered completely safe in pregnancy, though examinations should be performed only if clinically indicated and the duration should be kept optimal, particularly when using Doppler.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is the first trimester. During the second and third trimester ultrasound is used to estimate gestational age, to detect structural fetal anomalies, fetal lie and presentation and placental position.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- cardiac activity is visible at 5 to 6 weeks on transvaginal scanning and at 7 weeks on transabdominal scanning.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- from 6.5 weeks to 10 weeks. Biparietal diameter (BPD) is valid from 12 weeks up to 24 weeks; femur length from 18 to 20 weeks.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- cardiac pulsation is visible before any discernible morphology.\u003c/span>\u003c/div>"}, {"id": "1789238899199", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning ultrasound of the fetus from 18-20 weeks:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The BPD is measured in the axial plane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The lateral ventricles are echobright structures.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The medial walls of the lateral ventricles are formed by the septum pellucidum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The third ventricle is normally visualized.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The cerebellar hemispheres are seen as round echopoor structures with a reflective vermis in the midline.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- outer edge of the part of the skull near the transducer to the inner edge of the vault further from the probe is measured.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the choroid plexus that fills the lateral ventricles is echobright.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is a double membrane and contains the cavum septum pellucidum which may persist in adult life.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- seldom seen in the normal fetus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- at 18 weeks.\u003c/span>\u003c/div>"}, {"id": "1789238899201", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding the fetus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The vertebra are visible as two ossification centres in the body and one in each lamina.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Failure of fusion between the premaxillary part of the frontonasal prominence and the maxillary prominence gives rise to cleft lip.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The four-chamber view during cardiac ultrasound is the primary screening view for cardiac abnormalities. 100\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>On ultrasound the lungs become progressively echobright as pregnancy advances.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On ultrasound colonic peristalsis is seen in the second trimester.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- one ossification centre in each lamina and one in the body. On ultrasound these are seen as a triangle with the base posterior, in an axial view of the abdomen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- 101\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- due to developing alveoli. The diaphragm is seen as a smooth echopoor band between the chest and abdomen (in contrast to adults where it is echobright). Breathing movements are evident from early second trimester.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- small bowel peristalsis is commonly seen in the third trimester and colonic peristalsis is not seen in utero.\u003c/span>\u003c/div>"}, {"id": "1789238899203", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Concerning the fetal abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The small intestine becomes increasingly echobright towards the end of pregnancy.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The primitive intestinal loop lies outside the abdominal cavity in the first trimester.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>A diagnosis of abdominal wall defect can be made at 10 to 12 weeks.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The umbilical vein runs into the left portal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The abdominal circumference is measured as a parameter for gestational age in the second trimester.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is more echobright in the second trimester due to meconium, and as the fetus swallows more amniotic fluid in later pregnancy the small intestine becomes less reflective.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the intestine twists counter-clockwise for 270°around the superior mesenteric artery and as a result the caecum comes to lie in the right side of the abdomen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the physiological umbilical hernia disappears at 14 weeks. Abdominal wall should be intact during the middle trimester.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- blood flows from the left portal vein into the right portal vein (which perfuses the liver) and into the ductus venosus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a transverse section through the fetal liver, with the stomach,spine, the ribs in cross-section, the portal vein equidistant from both sides of the liver.\u003c/span>\u003c/div>"}, {"id": "1789238899205", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">Regarding fetal ultrasound:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The femur is strongly reflective at 10 weeks.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The distal femoral epiphyses is seen at 36 weeks.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The beginning of ossification of the proximal epiphysis of the humerus is good evidence of lung maturity.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The diaphysis of ulna and radius extend to the same level at the wrist.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The placenta can be identified as a discrete structure from 12 weeks. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- ossifies at 6 to 12 weeks.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the upper and lower femoral epiphyses appear later in the third trimester. The presence of a distal epiphysis in utero on a plain radiograph at 36 weeks signified maturity of the fetus. This is not practised any more.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- important relationship, as many bony anomalies foreshorten the distal radius.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899207", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">The breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>is a tubulo-acinar type of modified apocrine sweat gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>has mammary glands which develop from the pectoral portion of the milk line.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>has lobes that are epidermal in origin.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>has lactiferous ductules, acinar ducts and acini that are lined by a single layer of cuboidal epithelial cells.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>has the terminal duct lobular unit (TDLU) which consists of 15-20 lobes drained by a single lactiferous duct.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the primitive ectodermal milk line runs from the base of the forelimb to the region of the hindlimb.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the ducts are lined by columnar cells.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 15 to 20 lobes drain by lactiferous ducts onto the nipple. The lobes are divided into lobules. A lobule consists of a group of acini supplied by one terminal duct - the terminal duct lobular unit.\u003c/span>\u003c/div>"}, {"id": "1789238899209", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">The breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>lies entirely within the deep fascia of the chest wall.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>has the greatest proportion of fibroglandular tissue in the upper outer quadrant which gives rise to the axillary tail.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>has fibrous strands of deep fascia that pass through it towards the skin and nipple.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>has its main blood supply through the lateral thoracic and internal mammary arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>has a venous drainage through the azygos system.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- within the superficial fascia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the suspensory ligaments of Cooper are extensions from the superficial fascia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- further supply from the thoraco-acromial and intercostal arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- venous drainage of the breast includes internal thoracic, axillary, subclavian and azygos veins. The anastomoses between the azygos and vertebral venous plexus are important in the spread of metastatic disease to the spinal column.\u003c/span>\u003c/div>"}, {"id": "1789238899211", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">In the lymphatic drainage of the breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pectoralis major muscle is the reference for the surgical level of nodes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>This includes intercostal and internal thoracic chains.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Level 1 nodes are inferolateral to the pectoralis muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Level 2 nodes are superomedial to the pectoralis muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Excision of level 3 nodes requires radical surgery. 104\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- pectoralis minor is the reference.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the majority of lymph drains into the axillary nodes. Some lymph flow drains into the opposite breast and upper abdominal nodes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- level 2 nodes are deep and level 3 nodes are superomedial to this muscle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- with division of pectoralis minor muscle. 105\u003c/span>\u003c/div>"}, {"id": "1789238899213", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 07", "q": "\u003cdiv class=\"stem\">In the breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Epithelial proliferation occurs in the secretory phase of the menstrual cycle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Marked epithelial proliferation occurs within the TDLU with relative decrease in the surrounding fat and connective tissue during pregnancy.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Contrast between fat and soft tissue is optimized by the use of low energy X-ray spectra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The 45°mediolateral oblique view is used in the single view screening programmes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>There is a progressive decrease of dense fibroglandular tissue with fatty replacement with increasing age.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- epithelial proliferation occurs in the proliferative phase under oestrogens, followed by duct dilatation and diﬀerentiation under the influence of progestogens in the secretory phase.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- 17.4 and 19.6 keV are the characteristic peaks from a molybdenum anode.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this demonstrates the upper outer quadrant to best eﬀect.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- provides a comparatively diagnostic mammogram.\u003c/span>\u003c/div>"}, {"id": "1789238899215", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">In mammography:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(
