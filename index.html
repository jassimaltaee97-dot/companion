cspan class=\"letter\">(b)\u003c/span>The gastro-splenic ligament is a continuation of the lesser omentum from the stomach to the spleen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The falciform ligament contains the ligamentum venosum in its free edge.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The phrenicocolic ligament is continuous with the splenorenal ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The hepatoduodenal ligament transports the portal triad.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the liver in the bare area is attached to the diaphragm by areolar tissue and this area is continuous with the anterior pararenal space.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a continuation of the greater omentum from the greater curve of the stomach to the spleen. It contains the short gastric and left gastroepiploic vessels.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this carries the obliterated left umbilical vein (ligamentum teres) in its free edge. It is continuous with the fissure for the ligamentum venosum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the transverse mesocolon (see question 6\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this represents the thickened right edge of the lesser omentum. Behind it is the epiploic foramen leading into the lesser sac.\u003c/span>\u003c/div>"}, {"id": "1789238899075", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">In the anterior abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The superficial fascia has a superficial layer that is continuous with the superficial perineal fascia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The paired rectus abdomini are separated by the linea alba.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The rectus sheath is formed by the rectus muscles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The inguinal ligament is formed by the aponeurosis of the internal oblique muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superior epigastric artery runs in the posterior rectus sheath.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the deep layer of the superficial fascia passes inferomedially to form the superficial perineal fascia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the aponeurosis of the oblique and transverse muscles of the anterior abdominal wall form the rectus sheath within which the rectus abdominis muscle is enclosed.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the aponeurosis of the external oblique muscle forms a strong thick band - the inguinal ligament between the anterior superior iliac spine and the pubic tubercle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is a branch of the internal thoracic (mammary artery), runs behind the rectus muscle and then pierces and supplies it. Inferiorly it anastomoses with the inferior epigastric artery, a branch of the external iliac artery.\u003c/span>\u003c/div>"}, {"id": "1789238899077", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">In the abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The foregut extends from the lower oesophagus to the second part of the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The outline of both psoas muscles is seen in the majority of plain radiographs. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In a plain radiograph the properitoneal fat lines seen in each flank represent the borders of the peritoneum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The cardiac orifice of the stomach is at the level of T10 vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The right and left vagus nerves, oesophageal branches of the left gastric vessels are transmitted through the oesophageal hiatus in the diaphragm.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the foregut extends from the pharynx to the second part of the duodenum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- only seen in 48% of normal radiographs. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899079", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">The oesophagus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>has both striated and smooth muscle fibres in its lower third.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>is related to the left recurrent laryngeal nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>is anterior to the right subclavian artery in the thorax.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>is related to the azygos vein and the pleura below T4.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>is posterior to the left main bronchus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the muscular layers of the oesophagus are the superficial longitudinal and inner circular layers. In the upper third the fibres are striated, in the middle third the muscles are both striated and smooth fibres and in the lower third there are only smooth muscle fibres.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the neck the left recurrent laryngeal nerve runs in the tracheooesophageal groove and the trachea is anterior to the oesophagus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- though the oesophagus enters the thorax in the midline it deviates to the left of the midline. In the upper thorax, the left subclavian artery, aortic arch and upper part of descending aorta lie on its left.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- above T4 the oesophagus lies next to the pleura - forming the pleurooesophageal line.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the thorax from above downwards the trachea, left main bronchus, right pulmonary artery, left atrium and pericardium.\u003c/span>\u003c/div>"}, {"id": "1789238899081", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the oesophagus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The upper third is supplied by the inferior thyroid artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The middle third is supplied by the branches of the aorta.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The left gastric artery supplies the lower third.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lower third drains into the portal system.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The upper oesophagus has lymphatic drainage to the mediastinal lymph nodes.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a branch of the subclavian artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the left gastric vein drains the lower third into the portal system. The middle third drains into the azygos, therefore there is an important anastomosis between the azygos and portal system via the left gastric vein. The upper third drains into the brachiocephalic veins.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the upper oesophagus has lymphatic drainage into the deep cervical nodes, the middle to the posterior mediastinal nodes of the coeliac group.\u003c/span>\u003c/div>"}, {"id": "1789238899083", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the gullet:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Deglutition is best assessed by barium swallow examination using spot films.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A high kV chest radiograph may show the right wall of the oesophagus better than low kV chest radiograph. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>An oesophageal stricture is best assessed with the patient upright.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The normal indentations of the oesophagus are seen anteriorly and to the left.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The aberrant right subclavian artery with a left-sided arch of the aorta causes a posterior indentation of the oesophagus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- videofluoroscopy is used to assess the act of deglutition and provides anatomical information.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this may demonstrate the right wall of the oesophagus and azygos vein as they are outlined by the lung - the azygo-oesophageal line. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the prone position the oesophagus is distended well and strictures which may be missed in the upright position are best seen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- from above downwards these are as follows; where the pharynx joins the oesophagus, aortic arch, left main bronchus and where the oesophagus passes through the diaphragm.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in a left-sided aortic arch the aberrant right subclavian artery is the last brachiocephalic branch and courses obliquely from the left to the right behind the oesophagus. The aberrant left main pulmonary artery produces an anterior indentation.\u003c/span>\u003c/div>"}, {"id": "1789238899085", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">The stomach:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>is completely covered by peritoneum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>is anterior to the left kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>has a blood supply from all three branches of the coeliac axis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>has a lymph drainage that follows the arterial supply.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>has areae gastricae which are longitudinal elevations of the mucosa.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the lesser and greater omentum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the left suprarenal gland, gastric surfaces of spleen and anterosuperior surface of the pancreas, the mesocolon and the transverse colon.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the left gastric (from coeliac trunk) , right gastric (a branch of the common hepatic artery which arises from the coeliac artery), short gastric and left gastroepiploic arteries from the splenic artery (a branch of the coeliac trunk), right gastroepiploic artery from the gastroduodenal artery (a branch of the hepatic artery).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and drains into the coeliac lymph nodes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- these are small nodular elevations of the mucosal surface which measure 2-3 mm seen particularly in the gastric antrum.\u003c/span>\u003c/div>"}, {"id": "1789238899087", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Concerning the stomach:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Ultrasound of the stomach is useful in the diagnosis of infantile pyloric stenosis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>111In DTPA can be used to assess gastric emptying.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The local spread of stomach tumours is best assessed by MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The anterior surface of the stomach can be diﬀerentiated from the posterior surface during a barium meal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The oesophagogastric junction is the ‘B’ ring or Schatzki ring. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- as well as appendicitis, and intussusception in children.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- endoluminal ultrasound is probably best to assess the stomach wall.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the supine position, barium pools around the posterior rugal folds due to gravity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lower end of the oesophagus is dilated to form the vestibule, just above the oesophagogastric junction (mucosal junction between the oeosphagus and stomach - the ‘Z’ line). The upper limit of the vestibule is the ‘A’ ring and the lower limit as the ‘B’ ring or Schatzki ring which is usually below the diaphragm. \u003c/span>\u003c/div>"}, {"id": "1789238899089", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the duodenum:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>This C-shaped tube is wholly retroperitoneal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The first part runs upwards, forwards and to the right.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The duodenal cap has the same rugal pattern as the pylorus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The IVC lies directly behind the first part of the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The head of the pancreas is inferior to the first part of the duodenum.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the first inch (2.5 cm) of the duodenum is intraperitoneal. The remainder is retroperitoneal as it is covered only anteriorly by peritoneum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it runs upwards, backwards and to the right from the pylorus. Hence, the right anterior oblique position is needed to open out the loop formed by the first part with the second part of the duodenum. (The patient ’s right side is half-way oﬀ the table with an overcouch tube.)\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is the first 2 cm of the duodenum which is slightly conical in shape and is between the folds of the greater and lesser omentum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the portal vein lies between the first part of the duodenum and the IVC posteriorly.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899091", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the duodenum:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The second part is anterior to the hilum of the right kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The ampulla of Vater is in the posteromedial aspect of the second part.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The fundus of the gall bladder lies anterior to the second part.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The superior mesenteric vessels are posterior to the third part.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left psoas muscle is posterior to the terminal portion of the third part.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and right lobe of liver.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- exit the neck of the pancreas and run over the third part.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the right ureter, right psoas, IVC and aorta are the posterior relations of the third part of the duodenum from the right to left. The fourth part lies on the left psoas muscle.\u003c/span>\u003c/div>"}, {"id": "1789238899093", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the duodenum:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The duodenojejunal junction is at the level of the second lumbar vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The duodenal junction is held by the ligament of Treitz, a peritoneal fold that ascends to the left crus of the diaphragm.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The mucosa of the first part of the duodenum is broken up into circular folds - ‘plica circularis’.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The duodenal lymphatic drainage is primarily to the coeliac nodes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The duodenum is predominantly supplied by the coeliac axis. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it ascends to the right crus of the diaphragm. An abnormal position of this ligament indicates mal-rotation.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the mucosa of the first part of the duodenum is smooth. The rest of the small bowel is broken into the ‘plica circularis’.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the proximal duodenum is drained via pancreatico-duodenal nodes to the gastroduodenal nodes and to the coeliac nodes. The distal duodenum drains to the pancreatico-duodenal nodes which drain into the superior mesenteric nodes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- dual supply from SMA and coeliac axis - hence the diﬃ culty in controlling bleeding from an eroding duodenal ulcer. \u003c/span>\u003c/div>"}, {"id": "1789238899095", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">In the small intestine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The transition from jejunum to the ileum takes place gradually.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A Meckel’s diverticulum occurs in 2% of the population.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The small bowel mesentery is anterior to the right gonadal vessels.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The plica circulares are most prominent in the terminal ileum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>99mTechnetium-labelled colloid is used to detect Meckel’s diverticulum.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it is found in the ileum, on the antimesenteric border. Its blind end may contain gastric mucosa, liver or pancreatic tissue.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- from left to right posteriorly are the fourth part of duodenum, aorta, IVC, right gonadal vessels, the right ureter and psoas muscle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they become less prominent and less numerous in the ileum until at the terminal ileum, they are almost entirely absent.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- Meckel’s diverticulum containing gastric mucosa is detected using 99mTechnetium pertechnetate. Occult bleeding in the small bowel is detected using 99mTc labelled with colloid or red cells. Active bleeding at a rate of more than 0.5 ml per minute is required to enable detection at angiography.\u003c/span>\u003c/div>"}, {"id": "1789238899097", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the large intestine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The lateral cutaneous nerve of the thigh is posterior to the caecum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>An appendicolith is seen in 15% of the normal population.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ascending and descending colon are covered anteriorly and laterally by peritoneum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The third part of the duodenum lies posteriorly to the transverse colon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The proximal third of the transverse colon is supplied by the middle colic artery and the remaining two-thirds by the left colic artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the femoral nerve, the psoas and iliacus muscles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in patients with acute abdominal pain their presence indicates a 90% chance of appendicitis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this binds it to the posterior abdominal wall.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is the second part of the duodenum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the proximal two-thirds is supplied by the middle colic artery (branch of the superior mesenteric artery). The distal one-third is supplied by the ascending branch of the left colic artery (from the inferior mesenteric artery).\u003c/span>\u003c/div>"}, {"id": "1789238899099", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the large intestine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The sigmoid colon is retroperitoneal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The marginal artery of Drummond is a single arterial trunk formed by anastomoses of arteries around the inner border of the colon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Taenia coli are thickenings of the longitudinal muscle layers.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The colon has sacculations due to the mucosal folds.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The appendices epiploicae are sparse in the sigmoid colon. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the sigmoid colon is completely invested in peritoneum. It is attached to the posterior pelvic wall by the fan-shaped sigmoid meso-colon.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- these are three narrow bands present on the outer wall of the colon, they converge on the appendix proximally and the rectum distally.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the taeniae are shorter than the colon. Therefore the colon is thrown into sacculations which give the appearance of haustra on radiographs.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are sparse in the caecum and rectum and most numerous in the sigmoid colon. Herniation of mucous membrane through the appendices apiplocae leads to formation of diverticula. \u003c/span>\u003c/div>"}, {"id": "1789238899101", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the large intestine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The gas-filled large bowel on plain radiographs demonstrates the haustral pattern of incomplete septations.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>In Chilaiditi syndrome there is hepatodiaphragmatic interposition of the colon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The upper third of the rectum is covered in front and on both sides by peritoneum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The rectum is supplied by branches of the internal iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>There is a portosystemic anastomosis between the middle and inferior rectal veins.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the valvulae conniventis of the small bowel are complete.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is an asymptomatic condition, which can mimic the appearance of free intraperitoneal air and lead to unnecessary laparotomy.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the middle third is covered in front only and the lower third is uncovered.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the superior rectal (branch of inferior mesenteric), middle rectal (branch of internal iliac), inferior rectal (branch of internal pudendal) and median sacral artery (continuation of the aorta) supply the rectum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the superior rectal (a tributary of the inferior mesenteric which drains into the portal vein) forms an important portosystemic anastomosis with the middle rectal vein and inferior rectal vein (branches of internal iliac and internal pudendal veins).\u003c/span>\u003c/div>"}, {"id": "1789238899103", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the rectum and anal canal:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The lower two-thirds of the rectum drains into the internal iliac nodes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anal canal is about 3 cm long.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The upper part of the vagina is anterior to the anal canal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lymphatic drainage of the anal canal is to the internal iliac nodes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superior rectal artery supplies the upper half of the anal canal.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the lymphatic drainage follows vascular supply. The upper two-thirds drains into the inferior mesenteric nodes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and perpendicular to the rectum. This is important to remember when inserting a rectal tube. The tip of the tube has to be angled perpendicular and upwards after the first few centimetres into the anal canal to avoid hitting the anterior rectal wall, which is painful.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lower part.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lymph from the upper half of the anal canal drains into the inferior mesenteric nodes. The lower half drains into the superficial inguinal nodes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the inferior rectal artery supplies the lower half.\u003c/span>\u003c/div>"}, {"id": "1789238899105", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the rectum and anal canal:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anal canal is well visualized during a barium enema.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>During defaecating proctography the dynamics of rectal evacuation and position of the anorectal junction is evaluated.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>MRI is the investigation of choice to detect anal fistulae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The musculus submucosa ani has a high signal intensity compared to fat and submucosa on T 1-weighted MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The subcutaneous fibres of the external sphincter have a high signal on T 1-weighted MRI. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the enema tube position prevents this.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the anorectal junction at rest is just above the level of the ischial tuberosities. During evacuation the pelvic floor descends and the anorectal angle widens from 90°to 115°.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the musculus submucosa ani is a fascial extension of the longitudinal muscle coat of the rectum which inserts into the mucocutaneous junction (the Hilton’s white line). This has a low signal intensity compared to the high signal fat and submucosa on T 1-W MRI.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899107", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">In vascular imaging of the gastrointestinal tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Digital subtraction angiography may be degraded by patient movement.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The coeliac axis arises from the aorta at the level of T12 and L1 interspace.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The coeliac axis may be compressed by the median arcuate ligament preventing antegrade flow of blood.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left gastric artery runs upwards to the cardia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The coeliac axis is inferior to the lesser omentum.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in abdominal imaging bowel movement and respiration can worsen this. However this can be overcome by using anti-peristaltic agents and by obtaining multiple ‘mask’ images during the angiographic run whilst the patient is breathing, before contrast is injected.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- resulting in enlargement of collateral vessels arising from the superior or inferior mesenteric arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in 3% it arises directly from the aorta. It gives oﬀ cardio-oesphageal, anastomosing branches to the terminal branches of the right gastric and short gastric arteries. In 25% of individuals the left lobe of the liver is supplied by an aberrant left hepatic artery arising from the left gastric artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it lies above the pancreas and splenic veins, below the left lobe of the liver, on its left is the cardia of the stomach and in front is the lesser omentum.\u003c/span>\u003c/div>"}, {"id": "1789238899109", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the branches of the coeliac axis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The splenic artery is intraperitoneal during most of its course.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The transverse pancreatic artery is a branch of the left gastric artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The arteria pancreatica magna is a branch of the dorsal pancreatic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left gastro-epiploic artery arises from the terminal portion of the main splenic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left epiploic artery is a branch of the left gastro-epiploic artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- retroperitoneal most of its course and enters the lienorenal ligament before entering the spleen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the transverse pancreatic artery is a branch of the dorsal pancreatic artery, which arises from the proximal splenic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a branch of the mid-portion of the splenic artery and is usually the largest branch to the body of the pancreas.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- or from one of its terminal branches. It descends along the greater curvature of the stomach to form the ‘arcus arteriosus ventriculi inferior of Hyrtl’ with the right gastro-epiploic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the left epiploic artery, a branch of the left gastro-epiploic is located in the posterior layers of the greater omentum below the transverse colon. It anastomoses with the right epiploic to form the arcus epiploicus magnus of Barkow.\u003c/span>\u003c/div>"}, {"id": "1789238899111", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Concerning the hepatic arteries:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The common hepatic artery usually lies to the left of the common bile duct and anterior to the portal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The right hepatic artery usually crosses the common hepatic duct anteriorly. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle hepatic artery supplies the caudate lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left hepatic artery supplies the left lobe segments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>In approximately 25% of individuals the entire hepatic arterial supply arises from the superior mesenteric artery (SMA).\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- its first major branch is the gastroduodenal artery after which it continues as the proper hepatic artery and divides into the right and left hepatic arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- usually posteriorly. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- It supplies the quadrate lobe - segment IV.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- runs in the fossa for the ligamentum venosum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in 20% of individuals all or part of the hepatic arterial supply arises from the SMA, of these 10-12% will be replaced by right hepatic artery from the SMA, 4-6% from an accessory right hepatic artery from the coeliac axis. In 2.5% the entire hepatic arterial supply arises from the SMA.\u003c/span>\u003c/div>"}, {"id": "1789238899113", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the arteries of the upper abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The cystic artery to the gall bladder usually arises from the right hepatic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The right gastric artery is a branch of the superior mesenteric artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The gastroduodenal artery (GDA) arises usually from the right hepatic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The proximal GDA descends anterior to the first part of the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The GDA terminates into the right gastro-epiploic and anterior superior pancreaticoduodenal arteries.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- arises from the proper or left hepatic arteries in about equal proportions. It supplies the pylorus and courses along the lesser curve to anastomose with the left gastic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- In 75% of cases from the common hepatic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- behind the first part of the duodenum. Erosion of the duodenum by an ulcer can produce torrential bleeding and death if the GDA is involved. In this position the GDA is anterior to the pancreas.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899115", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the blood supply to the pancreas:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The retroduodenal artery forms an arcade to supply the posterior surface of the entire duodenum and part of the pancreatic head.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The inferior pancreatico-duodenal artery may arise from a proximal jejunal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The transverse pancreatic artery may arise from the anterior superior pancreatico-duodenal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The blood flow in the arterial tree is usually unidirectional.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The majority of the blood supply to the pancreas is derived from the dorsal pancreatic artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the head has a dual blood supply. The superior pancreatico-duodenal from the GDA and inferior pancreatico-duodenal from the SMA, both of which have anterior and posterior divisions forming extensive anastomoses.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- most commonly from the SMA.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in 10%. The transverse pancreatic artery is usually (75%) a branch of the dorsal pancreatic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- numerous anastomoses allow multi-directional flow.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the majority of the blood supply is from the splenic artery.\u003c/span>\u003c/div>"}, {"id": "1789238899117", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">The superior mesenteric artery (SMA):\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>arises from the anterior surface of the aorta at about the level of L1.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>gives rise to the dorsal pancreatic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>gives rise to the middle colic artery inferior to the uncinate process.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>gives rise to the right colic artery in a third of individuals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>gives rise to the inferior pancreatico-duodenal artery in the majority of cases. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- lies posterior to the body of the pancreas and splenic vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- or it arises from the SMA’sfirst jejunal branch.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- which enters the transverse mesocolon.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- Right colic is absent in 2% and arises most frequently from the middle colic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in 40% it arises as a single trunk from the SMA. In at least half of all individuals the common trunk or one of the anterior or posterior divisions arise from the first or second jejunal artery.This is important to bear in mind during selective catheterization of IPDA. \u003c/span>\u003c/div>"}, {"id": "1789238899119", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the arteries of the lower abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The inferior mesenteric artery arises from the anterior or left anterolateral aspect of the aorta at the level of L1.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The left colic artery anastomosis with the middle colic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The superior rectal artery is the terminal artery of the inferior mesenteric artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The middle and inferior rectal arteries anastomose with the superior rectal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The marginal artery of Dwight runs close to the distal large bowel from which the vasa recta arise.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- L 3.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- they are derived from the internal iliac artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the marginal artery of Dwight is situated close to the small bowel and the marginal artery of Drummond is close to the large bowel. The artery of Drummond may hypertrophy significantly when one of the main visceral arteries is compromised.\u003c/span>\u003c/div>"}, {"id": "1789238899121", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the portal venous system:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Direct portography may be achieved by a transjugular transhepatic approach.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The splenic and superior mesenteric vein join to form the main portal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The extra hepatic portal vein lies anterior to the common bile duct.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The right portal vein supplies the caudate lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The umbilical (distal) portion of the left portal vein supplies the lateral segments 2 and 3 and the inferior portion of segment 4.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- or puncture of the spleen, percutaneous portal vein puncture or through the umbilcal vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- behind the neck of the pancreas.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the common bile duct(CBD) and hepatic artery are anterior to the portal vein. The CBD is to the right and hepatic artery lies to the left.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the caudate lobe is supplied by the left portal vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the obliterated umbilical vein is patent in the presence of portal hypertension, courses vertically from the umbilical portion of the left portal vein in the falciform ligament to the anterior abdominal wall.\u003c/span>\u003c/div>"}, {"id": "1789238899123", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the venous drainage of the gut:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The superior mesenteric vein usually lies to the left of the superior mesenteric artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior superior pancreatico-duodenal vein drains into the main portal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The inferior mesenteric vein drains into the splenic vein in majority of individuals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left gastric vein drains into the confluence of the splenic and superior mesenteric vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The venous arcade formed by the epiploic veins serve as a collateral venous return from the spleen.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- SMV lies to the right of the SMA.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- drains into the splenic vein in 40%, into the confluence of the SMV and splenic vein in 30% and into the SMV in 30%.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- into the splenic vein in 15%, into the main portal vein in 25%.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the epiploic veins are tributaries of the gastro-epiploic veins.\u003c/span>\u003c/div>"}, {"id": "1789238899125", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding hepatobiliary imaging:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>CT arterio-portography (CTAP) is undertaken by catheterizing the SMA prior to CT scanning. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>CTAP enables better delineation of metastases than conventional CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In magnetic resonance cholangiopancreatography (MRCP) bile has a low signal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Magnetic resonance cholangiopancreatography uses heavily T 2-weighted sequences.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The liver parenchyma exhibits high signal on MRCP sequences.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- contrast is injected at 2 ml/second into the SMA which passes into the capillary bed of the mid gut and then into the portal vein. CT scanning during the portal venous phase outlines the portal vein, portal venous perfusion and hepatic veins. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- most hepatic tumours are supplied by the hepatic artery. CTAP produces dense enhancement of normal liver parenchyma and no enhancement of lesions supplied by hepatic artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- high signal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899127", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Concerning the adult liver:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is anterior to the upper pole of the right kidney and suprarenal gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>On ultrasound it has a slightly increased echogenicity compared with kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The walls of the hepatic veins are bright compared with those of the portal vein and its branches.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The intrahepatic bile ducts are usually clearly seen parallel to the portal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On non-enhanced CT the liver has a higher attenuation than the spleen.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the upper pole of right kidney, suprarenal gland and distal IVC are related directly to the liver and have no peritoneal coverings. Therefore free fluid cannot be seen anterior to the upper pole of the right kidney except in patients who have undergone liver transplantation.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is True\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the ‘shotgun’ sign when the bile ducts are of similar calibre and parallel to the portal vein indicates that there is intrahepatic biliary duct dilatation. However this sign may be seen in portal hypertension when there is compensatory enlargement of the branches of the hepatic artery, alongside those of the portal vein. Colour doppler will distinguish ducts from vessels.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- standard settings for upper abdomen are a window level of 40 to 60 HU and window width of 350 to 400 HU using 10 mm contiguous cuts.The relative density of the liver is 60 HU.\u003c/span>\u003c/div>"}, {"id": "1789238899129", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the liver:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Primary and secondary liver tumours derive their blood supply from the hepatic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The segmental anatomy of the liver relates to the hepatic arterial, portal and biliary drainage to the liver.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>On axial imaging the caudate lobe (segment 1) is posterior and to the right of the IVC.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Segments II, IVa, VIII, VII are above the portal vein in an anticlockwise fashion on axial CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Segments III, IVb, V,VI are below the portal vein in a clockwise fashion on axial CT.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899131", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">In the upper abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The caudate lobe of the liver lies in the greater sac.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The gall bladder is posterior to the porta hepatis. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The hepatic artery is anterior to the portal vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The hepatic vein tributaries run with those of the hepatic artery and bile ducts in the portal triad.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Behind the first part of the duodenum the common bile duct is anterior to the IVC.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the omental reflections divide the caudate from the quadrate lobe. The caudate lobe lies in the lesser sac and the quadrate lobe lies within the greater sac.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the gall bladder fossa is anterior to the porta hepatis. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the radicles of the portal vein, hepatic artery and bile duct run in the portal triads.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is the middle third of the CBD, The lower third of the CBD runs inferiorly and to the right, behind the head of pancreas. This portion of the CBD grooves or tunnels the head of the pancreas and is anterior to the right renal vein.\u003c/span>\u003c/div>"}, {"id": "1789238899133", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 05", "q": "\u003cdiv class=\"stem\">Regarding the gall bladder:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The gall bladder indents the posterior aspect of the first part of the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The cystic duct passes anterior to the right hepatic artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>On ultrasound, the neck of the gall bladder and the cystic duct are echogenic.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The Phrygian cap is the fundus folded back upon the body of the gall bladder.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Lymph drainage mainly follows the common bile duct to the liver.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterior aspect of first part of duodenum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- hence mistaken for gallstones.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- some lymph from the gall bladder flows directly into the liver. This is important in malignancy of the gall bladder as it may be necessary to resect local segments of the liver with the gall bladder tumour.\u003c/span>\u003c/div>"}, {"id": "1789238899135", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Concerning the pancreas:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The gland is angled inferiorly from right to left.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Most of the gland is posterior to the lesser sac.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The uncinate process is superior to the origin of the superior mesenteric artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The gastroduodenal artery is anterior to the head of the pancreas.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On ultrasound the pancreas may be hyperechoic compared with the liver.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is angled superiorly from right to left.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterior to the origin of SMA . The left renal vein is posterior.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- GDA is anterior to the neck of the pancreas.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- with increasing age the pancreas becomes more echogenic due to progressive accumulation of fat (see question 7 under ‘Breast’).\u003c/span>\u003c/div>"}, {"id": "1789238899137", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">The spleen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>lies posterior to the axillary line adjacent to the ninth and eleventh ribs.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>on ultrasound should measure no more than 14 cm in its longest axis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>is formed from the splenic diverticulum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>takes up 99mTc denatured red blood cells.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>enhances homogeneously in the early arterial phase of contrastenhanced CT. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is of mesenchymal origin and is formed by numerous splenunculi which fuse. Ten per cent of unfused or accessory splenunculi are demonstrated on USG or CT, usually in the region of the hilum or lienorenal ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- post splenectomy to detect residual splenic tissue.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the intrasplenic blood supply is inconsistent. This is appreciated on CT as inhomogeneous enhancement in the early arterial phase. \u003c/span>\u003c/div>"}, {"id": "1789238899139", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">The following are recognized anastomotic sites between portal and systemic circulations:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Azygos and left gastric veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Superior rectal and middle rectal veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Portal and hepatic veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Ovarian and mesenteric veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Left renal and splenic vein. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899141", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the development of the urinary tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The metanepheric duct develops from a diverticulum at the end of the mesonephric duct.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The metanephros diﬀerentiates from the ureteric bud to develop into the kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The metanephric duct develops into the ureter,\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The metanephros develps into the glomeruli and the proximal part of the renal duct system.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The collecting system of the kidney is derived from endoderm.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- also known as the ureteric bud.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the renal pelvis, calyces and collecting tubules.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from mesoderm.\u003c/span>\u003c/div>"}, {"id": "1789238899143", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 06", "q": "\u003cdiv class=\"stem\">Regarding the kidney:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It ascends from the pelvis during development.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class
