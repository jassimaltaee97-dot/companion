u003c/span> \u003cspan class=\"explain\">- in the lower leg, the artery passes deep to the extensor retinaculum, and can be palpated lateral to the extensor hallucis longus tendon and continues as the dorsalis pedis artery.\u003c/span>\u003c/div>"}, {"id": "1789238899005", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the veins of the lower limbs and abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Failure of the right subcardinal vein to connect with the liver leads to absence of the IVC.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A persistent left sacrocardinal vein results in a left-sided IVC.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The right common iliac vein is crossed by the common iliac artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The hepatic segment of the IVC is formed from the right vitelline vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A left-sided IVC drains into the coronary sinus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the drainage of the lower body is through the azygos system and SVC. Absent IVC is associated with cardiac abnormalities.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is true with that of the left.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the other segments are renal and sacrocardinal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- due to a persistent left sacrocardinal vein, cross-over to the right IVC occurs at the level of the left renal vein.\u003c/span>\u003c/div>"}, {"id": "1789238899007", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">In the lymphatic system:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Lipiodol is retained in lymph nodes for about 12 months.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The upper limit of normal in the short axis for retrocrural nodes is 10mm. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Fifty per cent of patients demonstrate cross-drainage of lymphatics from right to left at the level of L3/4.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The cisterna chyli continues upwards through the aortic opening in the diaphragm as the thoracic duct.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The thoracic duct drains the whole of the chest and limbs. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- used to monitor nodal size following therapy.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 6 mm, para-aortic and subcarinal nodes may be up to 12 mm. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- lumbar gap - non-opacification of nodes at this level on lymphography.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the thoracic duct drains all the body below the diaphragm, posterior right chest wall and left of the body above the diaphragm. The right lymph duct drains the remainder. \u003c/span>\u003c/div>"}, {"id": "1789238899009", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">The following are true:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The supraspinatus tendon passes above the acromion process.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The clavicle has a medullary cavity.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The rhomboid fossa marks the site of origin of the costo-clavicular ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The clavicle is the last bone to ossify.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A distance of less than 5 mm between the humerus and the acromion indicates likely supraspinatus tendon impingement.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- below the acromion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- there is no medullary cavity because of its mesenchymal origin.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in 5% of individuals an irregular groove is in the inferomedial aspect of the clavicle from which the costoclavicular ligament arises to insert into the first costal cartilage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- first bone to ossify, formed in membrane, appears after the first fetal month.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899011", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the shoulder joint:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The capsule of the shoulder joint is lax inferiorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The long head of the biceps runs under the transverse humeral ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The subscapularis bursa is a herniation of the shoulder joint synovial membrane deep to the subscapularis muscle, through a defect in the glenohumeral ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Teres major forms part of the rotator cuﬀ.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>During shoulder arthrography contrast passes normally into the subacromial bursa.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- attached proximally to the glenoid labrum and distally to the anatomical neck of the humerus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- teres minor, subscapularis, supraspinatus, infraspinatus - prime function of these muscle is to hold the head of the humerus in the glenoid cavity during all movement.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- contrast or air in the subacromial space implies disruption of the supra spinatus tendon.\u003c/span>\u003c/div>"}, {"id": "1789238899013", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 02", "q": "\u003cdiv class=\"stem\">Regarding the shoulder joint:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>CT arthrography is of value in the assessment of the glenoid labrum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>T2-W images and STIR (short tau inversion recovery) sequences with fat suppression can identify tears in the supraspinatus tendon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>On ultrasound, the supraspinatus tendon is echobright.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In anterior dislocation of the shoulder, cortical defects may occur in the anterior aspect of the head of the humerus. 30\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>All the rotator cuﬀ muscles are attached to the greater tubercle of the humerus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the prone oblique position provides more information about the posterior aspect of the glenoid labrum and the capsular attachments, which are important in patients with posterior dislocations.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the supraspinatus tendon is best seen in the coronal oblique plane.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the tendinous margin is echobright and central portion is echopoor.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they occur in the posterior aspect of the head of the humerus (Hill-Sachs lesion), which are best shown by a Striker’s view (patient supine, humerus 90°to the table with a cephald beam at 25°). 31\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- all but the subscapularis, which is attached to the lesser tubercle of the humerus.\u003c/span>\u003c/div>"}, {"id": "1789238899015", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">Regarding the upper limb:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The radial groove is situated in the radius.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The capitulum articulates with the ulna.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ligament of Struthers may compress the median nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The capitulum is the first secondary ossification centre to appear in the elbow.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A prominent posterior fat pad in a lateral radiograph of the elbow is seen in cases of joint eﬀusion.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- within the radial groove runs the radial nerve and the profunda brachialis artery.This groove is closely applied to the mid shaft of the humerus and a fracture in this location may give rise to neuropraxia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- capitulum-radial head; trochea - ulna.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this ligament runs from a supracondylar spur (which may be seen in less than 1% of individuals) to the medial epicondyle with the median nerve and brachial artery beneath it.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the order in which they appear are as follows: capitulum (1 year), radial head and medial (internal) epicondyle (5 years), trochlea (11 years), olecranon (12 years), lateral (external) epicondyle (13 years) - use the mnemonic CRITOE.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a prominent anterior fat pad is a normal variant in 15% of individuals.\u003c/span>\u003c/div>"}, {"id": "1789238899017", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the upper limb:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The annular ligament of the elbow blends with the ulnar collateral ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The bicipital aponeurosis separates the superficial median cubital vein from the deeper brachial artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ulna articulates with the carpal bones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The distal radio-ulnar joint has no communication with the carpal joints.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The ulna articulates with the triquetral only during ulnar deviation of the wrist.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it blends with the radial collateral ligament, surrounds the head of the radius like a horseshoe and is attached to the ulna medially.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the radius carries the hand.The lower extremity of the radius expands to form the articular surface for the wrist joint and the ulna.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- if a communication is demonstrated at arthrography, the triangular fibrocartilage must be disrupted.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899019", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">Concerning the wrist and carpus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The mid-carpal joint does not communicate with the radiocarpal joint.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>On a lateral wrist radiograph the distal radius has a slight volar tilt.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The lunate articulates proximally with the radius and distally with the capitate.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The flexor retinaculum is attached to the pisiform, hook of hamate, scaphoid tubercle and ridge of the trapezium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Flexor carpi-radialis attaches to the pisiform. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- if this is lost, a fracture of the radius should be suspected.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this forms the carpal tunnel which contains tendons of flexor pollicis longus, flexor digitorum profundus and superficialis and the median nerve. The tendon of flexor carpiradialis lies in a separate compartment of the carpal tunnel\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- flexor carpi-ulnaris. \u003c/span>\u003c/div>"}, {"id": "1789238899021", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the hand and wrist:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>In most cases two views are enough to exclude scaphoid fractures.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>In 15% of cases blood supply is from the distal to the proximal portion of the scaphoid.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The scaphoid ossifies in the sixth year.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>All the metacarpals articulate with each other and with the corresponding carpal bones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The commonest supernumerary bone of the wrist joint is the os radiale.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- four views are necessary, as fractures are easily missed - anteroposterior, 30°antero-posterior, lateral and scaphoid centred view.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- hence fractures at the waist may produce ischaemic necrosis of the proximal portion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- so do trapezium and trapezoid. Capitate and hamate ossify in the first year, triquetral in the second, lunate in the third, pisiform in the twelfth year.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- all but the first metacarpals which articulate only with the trapezium.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- lies immediately distal to the radial styloid.\u003c/span>\u003c/div>"}, {"id": "1789238899023", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In skeletal imaging:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Phased array surface detection coils greatly improve the signal to noise ratio in MRI of bone joint and soft tissue.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Abnormalities of cortical bone and calcification are usually not detected by MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Meniscal abnormalities of the knee are best demonstrated on T1weighted scans.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>A fat fluid level within the suprapatellar bursa of the knee joint indicates a fracture within the joint.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Bone scans using 99mTc MDP are very specific for pathology.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- T 2Fast spin echo sequence.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- lipohaemarthrosis seen in a lateral radiograph of the knee.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a three-phase study is used - immediate vascular images (0.3 minutes), a blood-pool phase (3-5 minutes), and delayed static images (4-6 hours). Bone scan is very sensitive to the presence of any pathology, but is relatively nonspecific. Hot spots are due to increased blood supply or osteoblast activity and may be seen in infection, fracture or malignancy.\u003c/span>\u003c/div>"}, {"id": "1789238899025", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the bony pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>the triradiate cartilage is seen as a Y-shaped lucency at the acetabulum in an immature skeleton in a plain radiograph.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>the iliac crest has a separate ossification centre.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>the rectus femoris originates at the anterior superior iliac spine.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>the obturator foramen is bounded inferiorly by the sacro-spinous ligaments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>the sacrotuberous ligament defines the posterior limit of the lesser sciatic foramen. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the ilium, ischium and pubis meet at the triradiate cartilage, fuses at 20 years of age.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- fuses from 20 years onwards.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- Sartorius originates at the anterior Superior ilaic spine and rectus femoris from the anterior inferior iliac spine. It is common for ‘tug’ lesions (avulsion) to develop from the latter in sports related injuries of adolescents.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the obturator foramen is bounded by the bodies and rami of the pubis and ischium. The sacrospinous ligament defines the inferior limit of the greater sciatic foramen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- runs from the ischial tuberosity to the side of the sacrum and coccyx and to the posterior inferior iliac spine. \u003c/span>\u003c/div>"}, {"id": "1789238899027", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The iliopsoas muscle passes anterior to the inguinal ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The aponeurosis of the external oblique has a thickening, which runs from the pubic tubercle to the anterior superior iliac spine as the inguinal ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The sacroiliac joint does not have a synovial component.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The intersosseous sacroiliac ligament is a strong ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Each half of the vertebral arch of the sacrum appears at 16-20 weeks of fetal life.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- posterior, to insert into the lesser trochanter.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- has a synovial component. The sacral surface is lined byfibrocartilage and the iliac surface by hyaline cartilage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it provides the main strength of the joint.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899029", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">Concerning the muscles of the pelvic girdle:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The majority of the gluteus maximus merges with the iliotibial tract.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The piriformis passes out of the pelvis through the lesser sciatic foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The obturator internus arises from the medial part of the obturator membrane and surrounding bone and passes through the lesser sciatic foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The gemelli muscles insert into the lesser trochanter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The tendons of obturator internus and gemelli muscles lie between the femoral head anteriorly and gluteus maximus posteriorly.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- through the greater sciatic foramen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the gemellus inferior arises from the ischial tuberosity and the gemellus superior arises from the ischial spine and insert into the greater trochanter.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899031", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the pelvis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anteroposterior view of the plain radiograph is taken with the legs rotated externally.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The paraglenoid sulcus transmits the superior branch of the gluteal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Shenton’s line runs from the lateral aspect of the femoral neck to the superior border of the obturator foramen on an AP radiograph.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The sacrum is better seen with a 35°cephalad angulation on the AP radiograph.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The sacroiliac joints are better profiled in the postero-anterior than the anteroposterior projection. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- rotated internally to compensate for the anteversion of the femoral neck.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the medial aspect of the femoral neck it usually is a smooth curve.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- Ferguson’s view. The Stork’s view to assess instability of the pubic symphysis is taken standing on each leg. Change in alignment of the superior surface of the pubic rami of more than 3 mm is abnormal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the plane of the SI joint diverges in the posteroanterior direction and the diverging X-ray beam is nearly parallel in the PA view. \u003c/span>\u003c/div>"}, {"id": "1789238899033", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In pelvimetry:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Routine assessment of the female pelvis is performed before delivery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>CT or MRI are used in place of plain radiography.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The conjugate diameter is the smallest AP diameter between the posterior margin of the symphysis pubis and the anterior aspect of the sacrum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The pelvic outlet dimensions are more important than the inlet dimensions.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The transverse outlet diameter is measured between the ischial tuberosities.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the most important measurement. Normal range is 11-12.5 cm.Less than 10.5 cm indicates increasing likelihood of cephalopelvic disproportion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- there is a considerable increase in the outlet diameter of up to 4 cm during delivery due to relaxation of the symphysis pubis and rotation of the sacroiliac joints.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- average is 10.5 cm.\u003c/span>\u003c/div>"}, {"id": "1789238899035", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the hip joint:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The fovea capitis to which the ligamentum teres is attached is not covered in cartilage.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The articular cartilage is thickest and broadest superiorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The fibrous capsule is attached around the rim of the acetabulum and inferiorly to the transverse acetabular ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The iliofemoral ligament is a thickening of the posterior capsule.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The Von Rosen’s view is useful in the assessment of femoral capital epiphyses in children.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- where the weight is borne.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the ischio-femoral ligament. The ilio-femoral ligament is attached to the anterior inferior iliac spine and to the inter-rochanteric line, and is anterior to the femoral neck.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the Frog’s lateral view is used for this - the Von Rosen’s view is used in the assessment of congenital dislocation of the hip. Judet’s views of the acetabulum and femoral head give information on the anterior and posterior columns of the acetabulum.\u003c/span>\u003c/div>"}, {"id": "1789238899037", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">Regarding the femur:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>MRI has a high sensitivity and specificity in detecting avascular necrosis of the femoral head.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anteversion of the neck of the femur increases from childhood into adult life.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The principal blood supply to the head of the adult femur is from the medial and lateral circumflex femoral arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The nutrient artery of the femur travels cranially.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The medial condyle is smaller than the lateral condyle. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in children the anteversion is greater, 50°at 1 year, 25°at 3-5 years and 8° by adulthood.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the central part of the head may be supplied by the artery of ligamentum teres, a branch of the obturator artery.This may be absent in about 20% of individuals. Intracapsular fractures of the femoral neck can compromise the blood supply to the head of the femur as the circumflex arteries may be torn. This gives rise to a high incidence of avascular necrosis of the femoral head or non-union.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- ‘Flee from the knee’. On a lateral view this is not to be mistaken for a fracture.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- larger. Hence the inferior surface of the femur is nearly horizontal despite the shaft being oblique. \u003c/span>\u003c/div>"}, {"id": "1789238899039", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the lower limb:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The patella is a sesamoid bone within the quadriceps tendon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The fabella is frequently found in the lateral head of gastrocnemius.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The shaft of the femur ossifies at the 35th week of fetal life.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In a bipartite patella the supero-lateral part is separate to the rest of the patella.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Tensor fascia lata arises from the anterior superior iliac spine and inserts into the lateral condyle of the femur.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- largest sesamoid bone.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a fabeLLa -‘L’ for lateral.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- starts to ossify at the seventh week of fetal life.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- usually bilateral. May be diﬃ cult to diﬀerentiate from a fracture.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- inserts into the iliotibial tract - a strong thickened band of deep fascia of the lateral aspect of the thigh (fascia lata) which is attached to the lateral condyle of the tibia.\u003c/span>\u003c/div>"}, {"id": "1789238899041", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the lower limb:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The rectus femoris arises from the anterior superior iliac spine.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Gracilis, sartorius and semitendinosus insert into the medial condyle of the tibia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The adductor magnus inserts along the linea aspera, the medial supracondylar line and the adductor tubercle of the medial femoral condyle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The adductor hiatus interrupts the distal attachment of the adductor longus muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The biceps femoris attaches to the lateral condyle of the femur.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the anterior inferior iliac spine. The sartorius and tensor fascia lata arise from the anterior superior iliac spine. The rectus femoris inserts into the base of the patella and by the patellar ligament to the tibial tuberosity. This insertion is the same for the other muscles which form the quadriceps femoris; vastus - lateralis, medialis and intermedius.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the femoral vessels pass through the hiatus in the adductor magnus to become the popliteal vessels.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- originates from the ischial tuberosity (long head) and the linea aspera (short head) and inserts into the head of the fibula.\u003c/span>\u003c/div>"}, {"id": "1789238899043", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the knee joint:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The synovium lining the joint is extracapsular.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A Baker’s cyst is an inflamed or swollen medial gastrocnemius - semimembranosus bursa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The lateral collateral ligament is separated from the capsule by the popliteus tendon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The anterior cruciate ligament passes from the anterior intercondylar area of the tibia to the medial femoral condyle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The medial collateral ligament is a flattened band that blends posteriorly with the fibrous capsule. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- intracapsular.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- best seen on ultrasound as an anechoic area that may connect to the knee joint.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it is a cord-like structure between the lateral epicondyle of the femur and head of the fibula.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- to the medial surface of lateral femoral condyle. It prevents femur moving backwards on tibia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899045", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the knee joint:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior cruciate ligament has low signal intensity on T1- and T2weighted sagittal scans.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior cruciate ligament (PCL) arises from the posterior intercondylar area and inserts into the anterior part of the lateral surface of the medial femoral condyle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The medial meniscus is larger and more semicircular than the lateral meniscus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Discoid menisci are less likely to tear than normal menisci.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The posterior horn of the lateral meniscus is attached to medial condyle of the femur by the menisco-femoral ligament, which divides to pass either side of the anterior cruciate ligament.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- partial tear may manifest as high signal within the ligament on T2or T2* images. More often a torn ACL is not visualized. Coronal images show medial and lateral collateral ligaments, sagittal images show menisci, cruciate ligaments and articular cartilages. Normal menisci and ligaments are low signal on T 1and T2.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the PCL is shorter and stronger than the ACL. It is infrequently torn compared with ACL.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the outer margin of the medial meniscus is blended with the fibrous capsule and the deep surface of the medial collateral ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- discoid menisci are thicker. However, more prone to tear and may be symptomatic even if not torn.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- pass either side of PCL. The anterior part is called ligament of Humphrey and the posterior part, ligament of Wrisberg. One or the other can be seen in about 70% of cases. They can be mistaken for a tear of the posterior horn of the lateral meniscus or for loose bodies in front of or behind the PCL.\u003c/span>\u003c/div>"}, {"id": "1789238899047", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the knee:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>A tunnel view shows the patella well.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The medial femoral condyle projects more anteriorly compared to the lateral femoral condyle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>A fat fluid level in the suprapatellar bursa in a horizontal beam lateral radiograph indicates a fracture within the joint.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The sartorius and gracilis tendons are posteromedial to the joint.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The popliteal vein lies deep to the popliteal artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a skyline view of the patella shows it best. A tunnel view of the intercondylar fossa of the upper end of the tibia is used to detect intra-articular opacities. These opacities are ‘loose’ bodies if they change position.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lateral femoral condyle projects more anteriorly and tends to prevent lateral dislocation.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- has a high correlation with a tibial plateau fracture - probably the most commonly missed fracture of the knee.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the vein is superficial to the artery. Hence during Doppler ultrasound for venous thrombosis, excess pressure with the probe will obliterate the lumen and it cannot be visualized. This applies to ultrasound of veins in general. However, this is a sign to be elicited with the probe held transverse to the vein, to ensure patency of veins.\u003c/span>\u003c/div>"}, {"id": "1789238899049", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">Regarding the lower legs:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The muscles of the anterior compartment are more prone to be aﬀected by compartmental syndrome. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The Achilles tendon has a sheath.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The tibialis anterior is the most medial and the largest of the flexor tendons of the foot.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The flexor digitorum longus tendon is lateral to flexor hallucis longus at the level of the talus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The tibialis posterior inserts into the talus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- they are in a compartment enclosed by the tibia, fibula and the interosseus membrane. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- strongest tendon, but no sheath, therefore tenosynovitis does not accur.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the tibialis posterior which provides support to the longitudinal arch. Problems in the arch can lead to tendonitis or even rupture usually just at or above the tibiotalar joint.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the mnemonic Tom (tibialis posterior), Dick (flexor digitorum longus), and (posterior tibial vessels and nerve), Harry (flexor hallucis longus) is helpful in remembering the relations of these important structures at the level of the ankle joint from medial to the poserto-lateral aspect.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- talus has no muscle attachment. The tibialis posterior inserts into the navicular, and gives variable slips to tarsal bodies and bases of second, third and fourth metatarsals.\u003c/span>\u003c/div>"}, {"id": "1789238899051", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">In the ankle and the foot:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The deltoid ligament lies medially, deep to the flexor tendons.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The deltoid ligament is responsible for about 85% of all ankle ligament injuries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The tibiofibular and calcaneofibular ligaments form the superior group of the lateral collateral ligament complex in the ankle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The sinus tarsus is a space between the talus and calcaneus and is filled with fat and hindfoot ligaments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Tarsal coalition is usually of no consequence.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lateral collateral ligament complex is responsible for about 80% of all ankle ligament injuries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- these form the inferior group. The superior group is formed by the anterior and posterior tibial and fibular ligaments. The anterior talofibular ligament is the most commonly torn ligament in the ankle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the sinus tarsi syndrome this fat is obliterated with disruption of the ligaments.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a common cause of a painful flat foot. The coalition which may be bony, cartilagenous or fibrous, most commonly occurs at the calcaneonavicular joint and is usually bilateral.\u003c/span>\u003c/div>"}, {"id": "1789238899053", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 03", "q": "\u003cdiv class=\"stem\">Concerning imaging of the ankle and foot:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Boehler’s angle is usually about 28°.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Congenital tarsal coalitions are best visualized using oblique radiographs with the foot internally rotated.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>On ultrasound, tendons are echopoor.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In the AP view of the foot the medial margin of the base of the second metatarsal should be in line with the medial margin of the intermediate cuneiform.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A fracture through the base of the fifth metatarsal is usually longitudinal to the long axis of the metatarsal. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- an angle less than 20°indicates flattening of the calcaneum due to crush injuries resulting from jumping on to a hard surface from a height.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- CT, particularly in the coronal plane, is the best way of looking at the subtalar joint.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- tendons are echobright. Echopoor areas in the tendon may be due to tendonitis and a gap in the tendon is diagnostic of a tear.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the oblique view of the foot, the medial margin of the base of the third metatarsal should be in line with the medial margin of the lateral cuneiform. If not, it is a Lisfranc injury.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- avulsion fracture of the base of the fifth metatarsal is transverse to the long axis of the metatarsal. An apophysis which mimics a fracture is longitudinal to the long axis of the metatarsal. \u003c/span>\u003c/div>"}, {"id": "1789238899055", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>By the fifth week of fetal life the gut tube within the peritoneal cavity is suspended by the dorsal mesentery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The blind ending hind gut is closed by the cloacal membrane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The superior mesenteric artery supplies the gut from the inferior half of the duodenum to the splenic flexure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The coeliac axis supplies the gut from the upper oeosphagus to the superior half of the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The inferior mesenteric artery supplies the hind gut distal to the hepatic flexure up to the anal canal.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the lower oesophagus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- distal to the splenic flexure up to the upper half of the anal canal.\u003c/span>\u003c/div>"}, {"id": "1789238899057", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">During embryological development:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>A condensation of endoderm in the dorsal mesogastrium forms the spleen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>In the third week of fetal life the liver arises from a hepatic diverticulum which buds from the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The dorsal pancreatic bud arises from the hepatic diverticulum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The pancreas may form a complete ring around the duodenum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The ventral pancreatic duct forms the accessory pancreatic duct.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the spleen develops as a condensation of mesenchyme in the dorsal mesogastrium of the lesser sac during the fifth week. It is derived from mesoderm and not from gut endoderm.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the gall bladder and cystic duct develop from a further budding from the hepatic diverticulum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the dorsal bud develops from the duodenum opposite the hepatic diverticulum from which sprouts the ventral diverticulum. The dorsal bud gives rise to the head, body and tail of the pancreas. The ventral bud develops into the uncinate process.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- annular pancreas probably results from a bilobed ventral bud with the two lobes migrating in opposite directions, around the duodenum to fuse with the dorsal bud.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the ventral pancreatic duct becomes the main pancreatic duct of Wirsung. The dorsal pancreatic duct forms the accessory duct of Santorini.\u003c/span>\u003c/div>"}, {"id": "1789238899059", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">In the development of the gut:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The cranial limb of the primary intestinal loop gives rise to most of the ileum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>During the sixth week of fetal life the midgut herniates into the umbilical cord. 48\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>During the 24th week of fetal life the midgut retracts into the abdomen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The mesenteries of the ascending and descending colon blend with the posterior peritoneal wall.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The lower part of the anal canal is ectodermal in origin.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the caudal limb develops into the ascending and transverse colon.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- as it herniates into the umbilicus the primary intestinal loop rotates around the axis of the superior mesenteric vessels through 90°in an anticlockwise direction. 49\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the tenth week it rotates counter-clockwise through 180°and the cephalic limb returns first, passing upwards into the space in the left of the abdomen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this forms an avascular plane, which the surgeon employs to mobilize the right and left colon.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- an ectodermal invagination termed proctodeum. The pectinate line in the adult marks the junction of the ectoderm and endoderm in the anal canal.\u003c/span>\u003c/div>"}, {"id": "1789238899061", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">In developmental anomalies of the gut:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Failure of recanalization of the lumen of the midgut may result in atresia or stenosis of the bowel.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Meckel’s diverticulum represents the remains of the embryonic right umbilical vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In an undescended caecum, neonatal intestinal obstruction is caused by Ladd’s band.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Ischaemic changes to the bowel in the fetal umbilical hernia may result in atresia or stenosis of the bowel.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The embryonic vitello intestinal duct gives rise to the appendix.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in the sixth week of fetal life, proliferation of the endodermal lining of the gut completely occludes its lumen. Recanalization takes place and is completed by the ninth week. Incomplete recanalization may lead to gut duplication.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the peritoneal fold which normally seals the caecum in the right iliac fossa passes across the duodenum (Ladd ‘s band) and causes a neonatal intestinal obstruction. The small bowel mesentery in this case is a narrow pedicle and allows volvulus of the whole small intestine - volvulus neonatorum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it may persist as Meckel’s diverticulum.\u003c/span>\u003c/div>"}, {"id": "1789238899063", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the peritoneum:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is a closed sac in both male and female.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The greater and lesser sac communicate through the epiploic foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The flow of peritoneal fluid is directed in a cephalad direction by the negative intra-abdominal pressure generated in the upper abdomen by respiration.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The peritoneal cavity is divided by the greater omentum into the supramesocolic and inframesocolic compartments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The root of the transverse mesocolon extends from the infra-ampullary segment of the duodenum through the head and along the lower edge of the body and tail of the pancreas.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- closed in the male, penetrated by the fallopian tubes in the female.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- foramen of Winslow.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and is directed by gravity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the transverse mesocolon and transverse colon divide the peritoneal cavity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899065", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Concerning the peritoneal spaces:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The right subphrenic space extends from the right coronary ligament postero-inferiorly to the falciform ligament medially.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>In the supine position the hepatorenal space (Morrison’s pouch) is more dependant than the right paracolic gutter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The lesser sac is posterior to the pancreas.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Fluid collections in the pelvis that spread to the left subphrenic space, generally involve the lesser sac. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Subphrenic collections are more common on the left than the right.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the falci form ligament separates it from the left subphrenic space.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- hence a common site for collections.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- anterior to pancreas, behind and to the left of the stomach.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the splenorenal and gastrosplenic ligaments limit the lesser sac on the left. Therefore fluid collection spreading into the left subphrenic space does not involve the lesser sac. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the phrenicocolic ligament extends from the splenic flexure of the colon to the diaphragm, partially separates the left posterior subphrenic space from the rest of the peritoneal cavity. It forms a partial barrier to the spread of fluid from the left paracolic gutter into the left subphrenic space which is why rightsided collections are more common than left-sided collections.\u003c/span>\u003c/div>"}, {"id": "1789238899067", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Concerning the peritoneal spaces:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The right inframesocolic space is in direct communication with the pelvis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The paracolic gutters are retroperitoneal recesses on the posterior abdominal wall lateral to the ascending and descending colon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>There are two potential spaces posterior to the bladder in women.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In the supine position the Pouch of Douglas is the most dependent portion of the peritoneum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The peritoneum is reflected on the prostate.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inframesocolic compartment is divided into the smaller right and larger left spaces by the root of the small bowel mesentery which runs from the duodenojejunal flexure to the ileocaecal valve.The right inframesocolic compartment is bounded by the transverse colon and the root of the small bowel mesentery.The left inframesocolic space is in free communication with the pelvis on the right of the midline and the mesentery of the sigmoid colon forms a partial barrier on the left of the midline.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- these are peritoneal recesses. Both are in continuity with the pelvic peritoneal spaces.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the rectouterine pouch of Douglas and the utero-vesical pouch. Men have one potential space posterior to the bladder - the recto-vesical pouch.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899069", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">In the pelvic peritoneum:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The rectum is covered by peritoneum on the front up to the junction of the middle and lower thirds.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The peritoneum is reflected on the infero-lateral aspect of the bladder bilaterally.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The broad ligaments contain the fallopian tubes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left limb of the sigmoid mesocolon is attached medially to the left psoas muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The left ureter runs in the apex of the sigmoid mesocolon.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is reflected over the fundus of the bladder.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the layers of peritoneum on the anterior and posterior surfaces of the uterus are reflected laterally as the broad ligaments.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the sigmoid and superior rectal vessels run between the layers of the sigmoid mesocolon and the left ureter runs behind its apex into the pelvis.\u003c/span>\u003c/div>"}, {"id": "1789238899071", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">In the abdomen:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The superior mesenteric vessels lie in the small bowel mesentery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The root of the transverse mesocolon is confluent with the root of the small bowel mesentery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The greater omentum inserts into the antero-superior aspect of the transverse colon. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lesser omentum forms the anterior surface of the lesser sac.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The inferior extent of the lesser omentum attaches to the porta hepatis.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in front of the horizontal part of the duodenum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- near the uncinate process of the pancreas. The middle colic vessels course through the transverse mesocolon.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the greater omentum descends from the greater curve of the stomach and proximal duodenum, passes inferiorly and then turns superiorly to insert into the transverse colon. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- its free edge extends to the porta hepatis as the hepatoduodenal ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the superior extent of the lesser omentum is attached to the fissures for the porta hepatis and ligamentum venosum.\u003c/span>\u003c/div>"}, {"id": "1789238899073", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 04", "q": "\u003cdiv class=\"stem\">Regarding the peritoneal ligaments:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Between the two layers of the right coronary ligament is the bare area of the liver.\u003c/div>\u003cdiv class=\"opt\">\u003
