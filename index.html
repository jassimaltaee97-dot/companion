a)\u003c/span>Fibroglandular tissue appears radiolucent compared with fat.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Normal ducts can usually be seen throughout the breast.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Normal intramammary lymph nodes are usually of calcific density.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The optimal examination should include the pectoralis major.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>There is a decreased incidence of malignancy with the P2 and DY patterns described byWolfe.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- fat appears radiolucent. Image quality emphasizes contrast and penetration of fibroglandular tissue in order to detect small tumours.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- normal ducts are thread-like and extremely diﬃ cult to visualize unless surrounded by fat or in the retroareolar region.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are of soft tissue density, have a lucent fatty hilum and are situated close to a vascular bundle towards the upper outer quadrant.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and include the inframammary fold with the nipple in profile.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- Wolfe graded the amount and distribution of fibroglandular tissue within a breast into four categories. N1=normal largely adipose tissue; P1=adipose breast with parenchymal thickening anteriorly, less than on quarter of the breast volume; P2 as P1 but involving greater than one quarter of the breast volume; DY=generalized increased density of the fibroglandular pattern, without a recognizable ductal or nodular appearance. There is an increased risk of malignancy with the P2 and DY patterns.\u003c/span>\u003c/div>"}, {"id": "1789238899217", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">In the breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>An accessory nipple (polythelia) is usually just inferior to the normal breast.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Accessory glandular tissue is more common than accessory breasts in the axilla.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Hypoplasia of the breast may be linked with Poland’s syndrome.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Calcification of sebaceous glands is pathological.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A skin papilloma appears well circumscribed often with a thin lucent rim (halo) caused by air between skin and the compression plate. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in 2 to 6% of women there is incomplete regression of the milk line.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- accessory glandular tissue is more common than accessory breasts in the axilla and is separate from the main breast tissue.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- underdevelopment of the structures of the chest wall or forelimb is Poland’s syndrome. Manifests as increased translucency of the aﬀected hemithorax.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- fine dense punctate calcification of sebaceous glands seen on tangential projection on to the skin surface is a normal finding.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899219", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">In ultrasound of the breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>A 3-5 MHz probe is ideal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Intramammary fat lobules are hypoechoic compared with the increased echogenicity of fat in the abdomen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The fibroglandular tissue is relatively hyperechoic compared with the fatty lobules.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Normal intramammary or axillary lymph nodes are usually ovoid, hypoechoic, with a central echogenic focus representing hilar fat.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Acoustic shadowing is always due to pathology.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 7.5 MHz probe is usually used.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in contradistinction to echobright fatty liver or fatty infiltration of pancreas.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- without increased through transmission of sound which is usually seen in hypoechoic cystic structures.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- though this is an associated finding with malignancy, it may be caused byfibroglandular tissue or the bright curvilinear bands of Cooper’s ligaments.\u003c/span>\u003c/div>"}, {"id": "1789238899221", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">In imaging modalities of the breast:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The ductogram has virtually been replaced by high frequency ultrasound and cytology.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>MRI is limited by motion artefact, noise and suboptimal resolution.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The diagnostic yield of MRI is improved by the use of surface coils and fat suppression.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Excellent inherent contrast between fibroglandular tissue and fat enable MRI to be used as a screening tool.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>MRI is contraindicated in patients who have a breast implant. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inherent contrast is excellent. However, MRI is not suitable as a screening investigation.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- MRI may have a place in the imaging of implants, to diﬀerentiate scarring from recurrent malignancy after surgery and to establish extent of tumour. \u003c/span>\u003c/div>"}, {"id": "1789238899223", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Concerning the various differences between paediatric and adult anatomy:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The weight of the neonatal suprarenal gland may be 30% of that of a neonatal kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Gastro-oesophageal and vesico-ureteric reflux are common in neonates.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>There is less mediastinal and retroperitoneal fat in children compared with adults.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Neonatal kidneys have a more lobulated contour compared with adults.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The curved diaphragm results in mirror image artefacts during ultrasonography of children.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- due to a large size in neonates the adrenal can be mistaken for the kidney in renal agenesis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and they may be physiological.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- on axial CT of the chest in children, it is diﬃ cult to assess mediastinal structures due to lack of inherent contrast.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- due to persistence of fetal lobulation after birth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- hence gives a false appearance of a mass in the upper abdomen or lower chest.\u003c/span>\u003c/div>"}, {"id": "1789238899225", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Concerning cranial ultrasonography:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is performed through the anterior fontanelle during the first year of life.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Axial sections, which correlate with axial sections of computerized tomography, are obtained at the level of the basal cisterns.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The choroid plexuses in the lateral ventricles are echobright.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Pulsating middle cerebral arteries are seen in the Sylvian fissure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The germinal matrix lines the floor of the lateral ventricles above the heads and bodies of the caudate nuclei.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- using a 5 MHz sector probe. Sometimes the posterior fontanelle and sutures may be used with a smaller ‘foot print’ probe.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- using the pterion (just above and behind the pinna of the ear) as the acoustic window.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- Elsewhere the lateral ventricles appear echopoor due to CSF. Intraventricular haemorrhage will also appear echobright.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- very vascular tissue, in the caudothalamic notch, is a site of haemorrhage in the preterm infant. Further tissue may be present in the third and fourth ventricle.\u003c/span>\u003c/div>"}, {"id": "1789238899227", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding paediatric ultrasonography:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The quadrigeminal cistern is echopoor in the neonate.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Asymmetry of the ventricles is usually pathological in the neonatal brain.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Incomplete ossification of the posterior spinal arches allows an acoustic window for spinal sonography. 112\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The spinal cord is echopoor with echobright posterior and anterior walls.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The vertebra appears as echobright blocks separated by echopoor intervertebral discs.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- contrary to expectations, this CSF-filled space is echobright and the reasons are not fully understood.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- obliquity of the ultrasound probe and position of the head are commoner than pathology. Asymmetry of ventricles can be seen in up to 40% of premature infants and is less than 20% in term babies.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- only for several months after birth, especially in the lumbar region. 113\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a central echobright line is present due to the interface between the central part of the anterior median fissure and myelinated ventral white commissure.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899229", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding the paediatric chest:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The trachea is less prone to compression in a child than in an adult.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Mediastinal widening in young children may be due to a normal thymus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The thymus enlarges in illness initially and reduces in size during recovery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>A complete ‘white out’ on a chest radiograph of a neonate is due to collapse or consolidation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>A posterior impression of the oesophagus can be due to aberrant neck vessels.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- trachea and airways are much narrower, more pliable than in adults and more prone to compression and obstruction. Repeated compression may result in a weak and flaccid trachea (tracheomalacia), which collapses and obstructs during expiration.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- on T 1-W MRI, this appears as a lobular intermediate signal structure in the superior mediastinum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- sickness, stress and steroids reduce the size of the thymus initially and the gland regrows during recovery - a common cause of erroneous diagnosis of thymic or mediastinal tumours as a cause of the child’s sickness.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- on expiration a neonate can almost white out the lungs.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899231", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding ultrasound of the gastrointestinal tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The mucosa of the pylorus appears echopoor.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The thickness of the normal pyloric muscle should not exceed 3 mm.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The pancreas is more easily visualized in children through the left lobe of the liver.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The left lobe of the liver extends anterior to the spleen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Splenunculi occur in 15% of children.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- mucosa is echobright and muscle is echopoor.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- dimensions vary depending on size of the child. However upper limits in the longitudinal section are as follows: 3 mm thickness of pyloric muscle, and 17mm in length for the pyloric canal. With measurements above these figures pyloric stenosis has to be suspected.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- provides an acoustic window.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- trace of free fluid between the left lobe of liver and spleen may give rise to an erroneus diagnosis of laceration of the spleen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899233", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Concerning the suprarenal glands:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>They lie in the anterior pararenal space.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>They lose 80% of their weight in the first 2 to 3 weeks after birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The glands have an echobright centre and echopoor rim.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The gland on the right lies between the IVC, right diaphragmatic crus, and the upper pole of the right kidney.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The gland on the left lies lateral to the aorta and left diaphragmatic crus, medial to the spleen and behind the stomach. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the upper poles of the kidneys in the perirenal fascia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 80% of the adrenal gland is fetal cortex and this undergoes haemorrhagic necrosis after birth causing loss of 30% of weight in the first few weeks.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and have limbs.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899235", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Concerning the renal tract:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Ectopic kidneys retain their reniform shape.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Bilateral renal agenesis is diagnosed on antenatal scans.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In crossed renal ectopia both ureters insert on the same side of the bladder.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>A horseshoe kidney usually lies above the level of the inferior mesenteric artery (IMA).\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>In a duplex kidney the ureter of the lower moiety enters the bladder below to that of the upper moiety.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- are not moulded by upper abdominal organs and therefore lose the reniform shape.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- occurs once in 3300 births and is diagnosed in utero due to the presence of oligohydramnios.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- ureter of the ectopic kidney crosses the abdomen to enter the correct side of the bladder.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it cannot ascend through the abdomen completely as the IMA stops the bridge of renal tissue in the lower abdomen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it enters at the normal orifice: the ureter of the upper moiety enters at an ectopic site lower than the normal orifice.\u003c/span>\u003c/div>"}, {"id": "1789238899237", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding the urogenital system in chidren:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>A narrow track may persist from the trigone of the bladder to the umbilicus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Cystoscopy is the most reliable method of detecting posterior urethral valves in boys.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In the first year of life about 90% of undescended testes lie within the abdomen and the remainder lie in the inguinal canal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The medullary pyramids of the neonatal kidney are more hypoechoic than older children.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The female urethra is imaged routinely in the oblique projection.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the ‘dome’ of the bladder the remnant of the urachus may be visible on cystography. This may give rise to midline cysts between the umbilicus and bladder.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- micturating cystography.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 10 to 20% lie within the abdomen and 80 to 90% lie in the inguinal canal.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and larger.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the male urethra is imaged in an oblique projection. In the female, congenital abnormalities are rare and the urethra is short. Therefore, it is imaged in the anteroposterior projection.\u003c/span>\u003c/div>"}, {"id": "1789238899239", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Concerning ultrasonography of the neonatal hip:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The examination is performed using a high frequency linear array probe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The femoral head is a round structure with fine stippled echoes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ‘V’-shaped acetabulum has the ischium posteriorly and the pubis anteriorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The ‘/H9251’ angle assesses the depth of the acetabulum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>In the dynamic assessment, the hip is flexed and backward pressure is applied and scanned for evidence of subluxation or dislocation.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- .\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the neonatal hip is largely a cartilagenous structure.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- echogenic bony cup with a central defect - the triradiate cartilage that separates the two bones.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is the angle between a vertical line along the lateral aspect of the ilium and the line joining the outer and the lowest part of the acetabulum - usually about 60°.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899241", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding paediatric bones and joints:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Bone maturation and development are assessed on a single view of the non-dominant hand and wrist. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The central shaft of a long bone (diaphysis) shows increased uptake of radioisotope compared to the metaphysis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The epiphysis is the ossified area distal to the physis in a long bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>An apophysis occurs at the sites of insertion of ligaments and tendons.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On ultrasound of the hips, the beta angle assesses the anteversion of the neck of the femur. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- centred over the head of the third metacarpal, the images may be analysed by two diﬀerent methods. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is True\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the physis or cartilagenous growth plate of long bones separates the metaphysis and epiphysis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- an accessory area of ossification, which does not contribute to bone length.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- assesses the prominence of the labrum. Dysplastic hips have low alpha angles and high beta angles. \u003c/span>\u003c/div>"}, {"id": "1789238899243", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding the imaging methods of the skull and brain:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Skull radiograph is sensitive to cerebral pathology.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Contrast between white and grey matter is superior on MRI compared to CT of the brain.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The contents of the middle and posterior fossa of the brain are better visualized with CT than with MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>On T1-weighted MRI, white matter has lower signal (darker) than grey matter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On T2-weighted MRI, grey matter has lower signal than white matter.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- investigation of choice for the detection of fractures, relatively insensitive to cerebral pathology.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- MRI is better. It does not suﬀer from streak artefacts from bone as seen in CT, which masks soft tissue detail.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- grey matter has lower signal intensity than white matter.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- white matter is of lower signal than grey matter.\u003c/span>\u003c/div>"}, {"id": "1789238899245", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding MRI of the brain:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Cerebrospinal fluid has high signal on T1-weighted images.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Cerebrospinal fluid has high signal on T2-weighted images.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In a proton density MRI sequence, grey matter is hyperintense to white matter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In CT of the brain the white matter is darker than grey matter.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The fornix and anterior commissure are hypointense on T 2-weighted images.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- cerebral spinal fluid has low signal on T1-weighted images.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- lipid rich myelin is relatively radiolucent.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- these are white matter tracts and therefore have low signal on T 2weighted images.\u003c/span>\u003c/div>"}, {"id": "1789238899247", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding the technique of brain CT and MR:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The axial plane for CT is usually parallel to a line tangential to the orbital roofs running to the anterior margin of the foramen magnum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The normal choroid plexus and the pituitary gland enhance on postcontrast CT images.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Mechanism of contrast enhancement of gadolinium DTPA is similar to that of iodinated contrast medium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Rapidly flowing blood is bright on a T1-weighted MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Time of flight MR angiography is an invasive procedure. 122\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this reduces the radiation to the lens of the eye but increases streak artefact within the middle cranial fossa.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- other structures to enhance are the cranial arteries, veins, dural venous sinuses and the infundibulum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- gadolinium DTPA is not visible on MRI. Gadolinium decreases the T1 and T2of hydrogen in its vicinity. Therefore in a T1-weighted image there is increased signal which shows up as enhancement.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- there is flow void and in vessels with rapidly flowing blood the signal remains hypointense even with gadolinium.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- non-invasive technique. 123\u003c/span>\u003c/div>"}, {"id": "1789238899249", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The skull vault develops in membrane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The occipital bone forms part of the central skull base.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Sutures are between bones of cartilaginous ossification.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Perisutural sclerosis is seen in the neonate.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Sagittal sutural fusion occurs before adolescence.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- skull base develops in cartilage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the occipital, sphenoid and temporal bones form the central skull base. Ethmoid and frontal bones complete the five bones of the skull.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are between bones of membranous ossifications.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the skull sutures are smooth in the neonate. Through childhood, interdigitations develop followed by perisutural sclerosis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- for practical purposes sutural fusion occurs in adolescence, since only in children does the raised intracranial pressure present with head enlargement.\u003c/span>\u003c/div>"}, {"id": "1789238899251", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">In the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior fontanelle (bregma) is between the frontal and parietal bones at the junction of the sagittal and coronal sutures.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior fontanelle (Lambda) closes around the second month after birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Pterion usually closes by 3-4 months.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The periosteum is invested externally and internally.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The endosteum is the outer of the two dural layers.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the bregma closes in the second year of life.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- both externally (pericranium) and internally (endosteum).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is continuous with the connective tissue at the sutures and fontanelle. Both extradural and subdural haematomas may cross sutures although, in principle at least, this anatomical boundary should prevent the spread of extradural collections.\u003c/span>\u003c/div>"}, {"id": "1789238899253", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 08", "q": "\u003cdiv class=\"stem\">Regarding the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Epicranial aponeurosis (galea aponeurotica) is loosely attached to the skull vault.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The skull vault has a high signal on T1-weighted MR images.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The diploic veins are found between the two tables of the skull.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Emissary veins traverse the skull vault.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Venous lacunae are close to the midline adjacent to the superior sagittal sinus. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- but the skin and subcutaneous tissues of scalp are firmly adherent to the aponeurosis.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- on MRI the subcutaneous fat is of high signal, superficial to a signal void of the skull vault.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the diploic space is between the inner and outer tables of the skull and contains marrow and large valveless thin-walled diploic veins, which are absent at birth. These communicate with meningeal veins, the dural venous sinuses and scalp veins.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the emissary veins form a rich craniocerebral anastomosis which provides both a route for the spread of infection across the vault and a collateral path in the event of venous sinus occlusion. This is an indirect sign of venous sinus occlusion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- venous lacunae are seen as multiple lucencies on skull radiographs. \u003c/span>\u003c/div>"}, {"id": "1789238899255", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">In the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The frontal bone forms in two halves.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The cribriform plate of ethmoid bone is interposed between the orbital plates of the frontal bone in the midline.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The coronal sutures separate the parietal and frontal bones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The pterion is a point where the frontal, sphenoid, parietal, temporal bones meet.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Anteriorly the parietal bone articulates with the frontal bone and lesser wing of sphenoid.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- normally fuses at 5 years. The intervening suture is known as the metopic suture which may persist wholly or in part into adult life in 5-10% of individuals.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- most of the floor of the anterior fossa is contributed by the orbital plates of the frontal bone. The crista galli, to which the falx is attached, ascends vertically from the cribriform plate.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the parietal bones on either side are separated by the sagittal suture.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- parietal bone articulates anteriorly with the frontal bone and the greater wing of sphenoid and inferiorly with the temporal bone.\u003c/span>\u003c/div>"}, {"id": "1789238899257", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the sphenoid bone:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The sphenoid air sinuses in the body of the sphenoid are symmetrical structures.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior clinoid process is part of the greater wing of sphenoid bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The posterior clinoid process is part of the lesser wing of sphenoid bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The posterior part of the floor of the anterior cranial fossa is formed by the lesser wing of sphenoid.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Part of the middle cranial fossa is formed by the greater wing of sphenoid.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are usually asymmetrical structures.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is part of the lesser wing of sphenoid bone.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the pterygoid fossa and posterior clinoid are borne on the superior surface of the body of sphenoid.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the posterior border of the lesser wing is the sphenoid ridge, meningiomas of skull base arise in this location.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899259", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">In the sphenoid bone:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The dorsum sellae is the anterior boundary of the pituitary fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The dorsum sellae merges laterally with the posterior clinoid process.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The foramina ovale, rotundum and spinosum are in the greater wing.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The greater wing separates the frontal lobe of the brain from the infra temporal fossa below.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Foramen rotundum travels from Meckel’s cave to the pterygopalatine fossa.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this forms the posterior boundary.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it separates the temporal lobe of the brain from the infratemporal fossa below.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it transmits the maxillary division of the trigeminal nerve - on coronal CT this foramen is demonstrated inferior to the anterior clinoid processes.\u003c/span>\u003c/div>"}, {"id": "1789238899261", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the foramen of the base of the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Foramen ovale transmits the mandibular division of the fifth nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The foramen spinosum is posterolateral to the foramen ovale. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The vidian or pterygoid canal is inferior to the sphenoid sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal carotid artery passes through the foramen lacerum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Foramen of Vesalius transmits an emissary vein and is medial to the foramen ovale.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- on coronal CT, the foramen ovale is inferolateral to the posterior clinoid process.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it transmits the middle meningeal artery and vein between the infratemporal and middle cranial fossa. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it is medial to the foramen rotundum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this foramen contains cartilage and is traversed only by small veins and nerves.The internal carotid artery crosses its cranial part.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899263", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the temporal bone:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The squamous part of the temporal bone forms the medial wall of the middle cranial fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The styloid process arises inferiorly from the base of the squamous temporal bones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The seventh cranial nerve (facial) passes through the stylomastoid foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The mandibular fossa is part of the squamous portion of the temporal bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The tympanic portion of the temporal bone is a border of the internal auditory canal.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it forms the lateral wall, separated from the parietal bone by the squamosal suture.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the base of the petrous temporal bone. Calcification of stylohyoid ligament may be seen on a lateral radiograph of cervical spine.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the stylomastoid foramen is behind the styloid process.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it forms part of the external auditory canal.\u003c/span>\u003c/div>"}, {"id": "1789238899265", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The posterior cranial fossa is the largest of the three cranial fossae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The basisphenoid synchondrosis (in the clivus) is the articulation between the basioccuput and the base of sphenoid.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In the adult the clivus is hyperintense on T1-weighted MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The occipital bone has a significant diploic space inferiorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The jugular foramen lies between the temporal and occipital bones.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the occipital bone forms most of the walls and floor of the posterior cranial fossa.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- due to replacement of red marrow with fat. In children the clivus is hypointense.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- typically devoid of a diploic space inferiorly. Therefore the hair on end appearance secondary to marrow hyperplasia seen elsewhere on the skull vault, spares this region.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899267", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the normal skull radiograph:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Vascular markings are present antenatally.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Vascular markings are radiolucent.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The sphenobregmatic sinus runs on the lesser wing of sphenoid.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Venous impressions on the vault are smaller than those due to arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Arterial impressions are parallel to each other and reduce in calibre after branching. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they do not develop until the postnatal period and persist through life.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- have indistinct margins and often branch.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a suﬃ ciently large vein running along the coronal suture, which gives rise to a prominent vascular impression.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- venous impressions are larger than those due to arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899269", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">The following give rise to lucencies within the skull vault on skull radiographs:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Sutures.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Pineal gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Normal thinning of the temporal squame and parietal bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Choroid plexus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The dura.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- gives rise to calcification.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- gives rise to calcification.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- gives rise to calcification.\u003c/span>\u003c/div>"}, {"id": "1789238899271", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">The following give rise to calcifications within the vault on skull radiographs:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Vascular impressions.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Parietal foramina.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Pacchionian depression.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Pneumatization.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Habenular commissure.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- all the above give rise to lucencies.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- choroid plexus, petroclinoid and interclinoid ligaments are other causes of calcifications seen on a skull radiograph.\u003c/span>\u003c/div>"}, {"id": "1789238899273", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the meninges:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The three components are the outer fibrous dura, the avascular arachnoid and the inner vascular pia mater.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The dura and the arachnoid form a free space (subdural) which can be appreciated in normal individuals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The dura mater has two layers which separate to enclose the dural venous sinuses.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The outer and inner layer of the dura give rise to the falx and tentorium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The dura does not enhance after intravenous contrast on MR imaging.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the dura and arachnoid are applied closely, therefore this is a potential space where haemorrhage or pus may accumulate.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inner layer of the dura covers the brain and gives rise to the falx and tentorium. The outer layer of the dura is the periosteum of the inner table of skull.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- normal dura shows contrast enhancement.\u003c/span>\u003c/div>"}, {"id": "1789238899275", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the skull:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Wormian bones are small bony elements seen in suture lines and suture junctions.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The basal ganglia and dentate nucleus may show punctate calcification with increasing age.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The interclinoid ligaments stabilize the anterior and posterior clinoid processes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The pineal gland is anterior to the third ventricle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superficial temporal artery grooves the inner table of the temporal and parietal bones. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- these are usually normal variants but may be pathological when multiple in conditions such as cleidocranial dysostosis, osteogenesis imperfecta and hypophosphatasia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the interclinoid ligaments are dural calcifications seen in the lateral skull radiograph. They are not described to play a role in the stability of the clinoid processes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- posterior to third ventricle. Calcification is seen in 50-70% of adult lateral skull radiographs.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it grooves the outer table of the temporal and parietal bones. \u003c/span>\u003c/div>"}, {"id": "1789238899277", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the meninges:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The falx cerebri consists of two layers and forms a complete partition between the cerebral hemispheres.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The tentorium cerebelli is attached from the posterior clinoid processes and along the petrous ridges.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The uncus of the hippocampus and the posterior cerebral artery lie below the free edge of tentorium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The free border of the tentorium cerebelli encloses the cavernous sinus on each side.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The diaphragma sellae is pierced by the pituitary stalk.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- incomplete partition between the cerebral hemispheres, extends from the crista galli to the internal occipital protuberance.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they lie above the free edge of the tentorium and are at risk of compression against the tentorial edge when there is raised intracranial pressure in the supratentorial compartment (coning).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- on each side of the pituitary fossa before attaching to the anterior clinoid processes.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899279", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding meningeal blood supply and innervation:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The main blood supply to the meninges is from the middle meningeal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The accessory meningeal artery may arise from the maxillary or middle meningeal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle meningeal artery is subdural in location.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Innervation of the dura is primarily from the trigeminal nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The jugular foramen transmits the ninth, tenth and eleventh cranial nerves.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- however, there are contributions from the cavernous, carotid, ophthalmic and vertebral arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this artery enters the skull through the foramen ovale and supplies the meninges.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- It is extradural and along with the meningeal veins grooves the inner table of the skull.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and also from the lower cranial nerves and the first three cervical segments. This may be the reason for cervical pain in cranial subarachnoid haemorrhage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899281", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the normal development of the brain:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The neural tube expands to form the three primary vesicles during the twelfth week of intrauterine development.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Hypodense white matter in a pre-term infant’s CT brain usually signifies ischaemia.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Vascular supply of the embryonic brain is similar to that of the adult.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>MRI is insensitive to assess the progress of myelination.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Most of the gyri are formed by 18 weeks of gestation. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- during the fourth week of intrauterine development.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- due to the relatively high water content, white matter of the normal preterm infant appears hypodense and should not be mistaken for ischaemia.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the embryonic brain is exclusively supplied by the internal carotid artery, which may persist in the adult when one of the two posterior cerebral arteries is supplied only through the ipsilateral posterior communicating artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- MRI is used to assess the progress of myelination. T 1-weighted inversion recovery images are particularly sensitive to myelination in the first 6 months. Thereafter T2 -weighted images are used.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the brain has more gyri towards term. \u003c/span>\u003c/div>"}, {"id": "1789238899283", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">In the paediatric population:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The entire brainstem is myelinated at birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior limb of the internal capsule myelinates before the anterior limb of the internal capsule.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The optic radiation myelinates after 12 months.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The adult pattern of myelination is present on T 1-weighted images after 6 months of age.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On T2-weighted MRI unmyelinated fibres may be visualized at the age of 4.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the ventral pons is not myelinated.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- at term the posterior limb is myelinated. At 4 months the anterior limb starts to myelinate.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- myelinates soon after birth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- therefore,T2-weighted images are used after the first 6 months as they show heterogeneous white matter signal intensity in the first 6 months.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899285", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the medulla:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is closed superiorly where it is related to the lower part of the fourth ventricle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The gracile and cuneate columns are on the ventral surface of the medulla.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The dorsal surface of the medulla becomes the floor of the fourth ventricle below the foramen of Magendie.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The glossopharyngeal (ninth), the vagus (tenth), the spinal accessory (eleventh) and the hypo-glossal (twelfth nerves) arise from the medulla.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On axial MRI the pontomedullary junction is denoted by a broad basilar sulcus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is closed inferiorly around the central canal continuous with that of the spinal cord and open superiorly with the lower part of the fourth ventricle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- on the ventral surface between the anterior median fissure and the anterolateral sulcus on each side is the pyramid and lateral to this is another elevation, the olive.The gracile and cuneate columns are on the dorsal aspect of the medulla.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- above the foramen of Magendie the dorsal surface becomes the floor of the fourth ventricle, which opens into the cerebellopontine angle on each side through the foramen of Luschka around the inferior cerebellar peduncle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- from above downwards.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- there is a prominent pontomedullary sulcus on each lateral wall.\u003c/span>\u003c/div>"}, {"id": "1789238899287", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">The pons:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>is concave on the ventral aspect containing mainly transverse fibres which pass posterolaterally as the middle cerebellar peduncle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>is dominated by the posterolaterally directed middle cerebellar peduncles in the lower aspect.\u003c/div>\u003cdiv
