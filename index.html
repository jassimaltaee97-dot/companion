 class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>gives arise to the trigeminal nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>gives rise to the abducent nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>is posterior to the two roots of the facial (seventh) nerve as they pass from the inferior pontine border laterally in the cerebellopontine angle cistern. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it has a convex bulbous ventral portion at this level.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the cerebellopontine angle is lateral to the middle cerebellar peduncle and limited posteriorly by the flocculi.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- at this level the superior cerebellar peduncle forms the lateral border of the fourth ventricles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the long intracranial course in an anterolateral direction to bend over the petrous apex takes the abducent nerve through the dura covering the sphenoid bone (Dorello’s canal) to enter the cavernous sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- here they are closely related to the vestibular cochlear nerve. \u003c/span>\u003c/div>"}, {"id": "1789238899289", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">The midbrain:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>comprises the dorsal tectum and the paired cerebral peduncles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>contains the cerebral aqueduct of Sylvius.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>has the nuclei of the third and fourth cranial nerves.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>is surrounded by CSF in the ambient cistern laterally and the quadrigeminal plate cistern posteriorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>is concerned with auditory reflexes.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- connects the third and fourth ventricle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- third nerve nucleus in the tegmentum, fourth nerve nucleus at the level of the inferior colliculi.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the tectum is posterior to the cerebral aqueduct and consists of a pair each of the superior colliculi - concerned with visual reflexes and the inferior colliculi - concerned with auditory reflexes.\u003c/span>\u003c/div>"}, {"id": "1789238899291", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">In the head:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The inferior sagittal sinus is usually identified at catheter angiography.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The great cerebral vein and inferior sagittal sinus form a straight sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The transverse sinus commences at the torcular and lies within the outer margins of the tentorium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>An absent transverse sinus is associated with lack of vascular impression along its course on the skull vault\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The spinal root of the accessory nerve passes upwards through the foramen magnum.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it lies in the free margin of the falx cerebri, seen only rarely in adult angiography but more commonly in children.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this lies within the quadrigeminal plate cistern.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the right is usually dominant receiving almost the entire output of the superior sagittal sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the underdeveloped bony depression of the vault is often helpful to identify this normal variant of the transverse sinus. Moreover, the jugular foramen of the corresponding side is under developed and these features are examined with CT.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899293", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 09", "q": "\u003cdiv class=\"stem\">Regarding the diencephalon.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The structures comprising the diencephalon border the third ventricle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The calcification of the habenular commissure is anterior to the pineal gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The anterior commissure consists of myelinated fibres in the lamina terminalis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The thalami extend anteriorly as far as the inter-ventricular foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The posterior limb of the internal capsule separates the thalamus from the lentiform nucleus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the diencephalon includes the thalamus, hypothalamus, pineal gland and habenula.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- connects the habenula on each side.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is the anterior limit of the diencephalon. A line joining the anterior and posterior commissures on midline sagittal MR scans (the AC-BC line) is a standard reference in image guided stereotactic surgery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899295", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the pituitary gland:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pituitary gland is superior to the suprasellar cistern. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The thickness of the infundibulum normally exceeds the diameter of the basilar artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The posterior pituitary usually returns a high signal on T1-weighted images.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Mal-descended pituitary tissue may be found as a soft tissue mass expanding the infundibulum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The pituitary gland is usually of a constant size in the adult.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the suprasellar cistern is a superior relation to the pituitary containing the optic pathways and the Circle of Willis. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the infundibulum is larger in girls, but it should not exceed the diameter of the basilar artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is thought to be due to neural secretory granules in the pituitary.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- usually as a rounded high signal mass.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in some individuals it may appear as a thin rim of tissue at the base of the sella (partially empty sella) and in females of child-bearing age the pituitary will fill the sella and have a superior convex margin.\u003c/span>\u003c/div>"}, {"id": "1789238899297", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the basal ganglia:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>They are part of the extra-pyramidal system.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The head of the caudate nucleus indents the anterior horn of the lateral ventricle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The lentiform nucleus comprises the lateral globus pallidus and the medial putamen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The claustrum is a thin sheet of white matter between the putamen and insula.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The lentiform nucleus is bounded medially by the internal capsule.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- they consist of the caudate and lentiform nuclei, together known as the corpus striatum, the amygdala and claustrum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the tail of the caudate nucleus comes to lie above the temporal horn and is not readily seen on MRI.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the larger lateral component is the putamen and the smaller medial component is the globus pallidus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the claustrum is a thin sheet of grey matter.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899299", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the motor pathways:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The upper motor neurons arise in the pre-central gyrus of the frontal lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The fibres from the primary motor cortex join the corona radiata which converges towards the internal capsule.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The anterior limb of the internal capsule is supplied by the artery of Huebner (from the anterior cerebral artery).\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The white matter above the lateral ventricle is known as the corona radiata.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The corticospinal fibres are found in the anterior limb of the internal capsule.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the anterior choroidal artery supplies the posterior limb and the genu is supplied by the lenticulostriate arteries.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the centrum semiovale.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are found in the posterior limb, corticobulbar fibres are present in the genu.\u003c/span>\u003c/div>"}, {"id": "1789238899301", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the cerebral hemispheres:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The corpus callosum is the largest of the commissural tracts.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The forceps major are the fibres into the frontal white matter from the corpus callosum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The central sulcus (Rolandic fissure) separates the frontal and parietal lobes. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The parieto-occipital fissure runs obliquely on the medial aspect of each hemisphere.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The sylvian or lateral fissure separates the inferior surface of the frontal lobe and the superior surface of the temporal lobe.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- others are the projection fibres and association fibres.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- forceps minor into frontal white matter and forceps major into occipital lobes from the corpus callosum, respectively.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899303", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the limbic system:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It includes the limbic lobe, olfactory apparatus and the septal areas.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The limbic lobe can be divided into a large limbic gyrus and two slender intra-limbic gyri.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The limbic gyrus includes the subcallosal gyrus and the cingulate gyrus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The parahippocampal gyrus forms part of the mesial temporal lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The hippocampus lies in the roof of the temporal horn of the lateral ventricles.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it lies in the floor of the temporal horn of the lateral ventricles.\u003c/span>\u003c/div>"}, {"id": "1789238899305", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the cerebral ventricles:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>They contain between 20 and 25 ml of cerebrospinal fluid in the young adult.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The lateral ventricles are roofed by the fibres of the corpus callosum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Septum pellucidum separates the anterior horns and bodies of the lateral ventricles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Persistent cavum septum pellucidum is found in approximately 10% of adults.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The cavum vergae is a continuation of the cavum septum pellucidum beneath the splenium.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the choroid plexus is invaginated into the medial walls of the lateral ventricles and into the roofs of the third and fourth ventricles through the choroidal fissure.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it is a midline triangular sheet attached above and anteriorly to the corpus callosum and posteriorly to the fornix.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899307", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the ventricles and basal cisterns:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The trigone of the lateral ventricle is the confluence of the body, occipital and temporal horns.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Calcification of the choroid plexus is more common on the lateral skull radiograph than on CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The velum interpositum is a cisternal space above the fornix.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal cerebral veins are located in the quadrigeminal plate cistern\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The cavum vergae extends anterior to the foramen of Monro above the fornix. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the choroid plexuses of the lateral ventricle are here and almost invariably calcify and appear as high attenuation structures on CT.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- a cisternal space below the fornix formed by infolding of the tela choroidea.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are in the cistern of the velum interpositum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899309", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the fourth ventricle:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>In sagittal section it is triangular with an anterior floor and a roof directed to the apex.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The upper part of the roof is formed by the superior cerebellar peduncles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The cerebrospinal fluid flows cranially from the fourth to the third ventricles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>CSF flows out into the basal cisterns.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Intraventricular tumours spread through the foramen of Luschka into the subarachnoid spaces.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- caudally through the third and fourth ventricles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899311", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the subarachnoid cisterns:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The cisterna magna lies between the pons and the postero-inferior surface of the cerebellum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The cisterna magna is continuous below with the spinal subarachnoid space.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The cisterna magna contains the vertebral, posterior inferior cerebellar arteries through its lateral part.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The basilar artery lies in the pontine cistern.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The ambient cistern surrounds the midbrain and transmits the posterior cerebral and superior cerebellar arteries.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- between the medulla and the postero-inferior surface of the cerebellum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and receives CSF from the fourth ventricle via the foramen of Magendie and Luschka.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it also contains the ninth, tenth and eleventh nerves.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the basal veins of Rosenthal and the trochlear nerve.\u003c/span>\u003c/div>"}, {"id": "1789238899313", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the subarachnoid cisterns:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The chiasmatic or suprasellar cistern contains the circle of Willis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The chiasmatic cistern leads posteriorly to the interpedencular cistern.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The cistern of the great cerebral vein is the quadrigeminal cistern.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The confluence of the vein of Galen and inferior sagittal sinuses occur in the quadrigeminal cistern.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The pericallosal artery runs in the cistern of the lamina terminalis.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- these contain the terminal basilar artery with branches and the occulomotor nerves. Blood within the cistern may be the only evidence of a subarachnoid haemorrhage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this lies adjacent to the superior surface of the cerebellum and extends superiorly around the splenium of the corpus callosum. It contains the posterior cerebral, posterior choroidal and superior cerebellar arteries and the trochlear nerve.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it runs in the callosal cistern and the anterior communicating artery runs in the cistern of the lamina terminalis.\u003c/span>\u003c/div>"}, {"id": "1789238899315", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the intracranial circulation:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>When present, the trigeminal artery arises from the vertebral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The internal carotid artery is the larger of the two terminal branches of the common carotid artery. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The internal carotid enters the cranial cavity via the carotid canal in the petrous bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal carotid artery enters the subarachnoid space just inferomedial to the posterior clinoid process.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The internal carotid artery terminates into its major branches just medial to the optic chiasm.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- arises from the internal carotid artery, and represents the embryonic connection between the carotid and basilar arteries which rarely persist into adulthood.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it runs approximately horizontally and anteromedially across the upper half of the foramen lacerum, turns upwards and medially to enter the posterior part of the cavernous sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- inferomedial to the anterior clinoid process.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- just lateral to the optic chiasm.\u003c/span>\u003c/div>"}, {"id": "1789238899317", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the intracranial circulation:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The carotid siphon is the fusiform dilatation at the origin of the common carotid artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The ophthalmic artery is the first supraclinoid branch of the internal carotid artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The anterior choroidal artery arises distal to the posterior communicating artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal carotid artery terminates below the anterior perforated substance by dividing into the anterior and middle cerebral arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The T-shape bifurcation into anterior and middle cerebral arteries lies in the direct coronal plane.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the U-shaped loop formed by the cavernous and immediately supra cavernous portions of the internal carotid artery (contrast to carotid body).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is directed posterolaterally and necessitates an oblique projection to display the tuning fork-like arrangement of the anterior and middle cerebral arteries enface.\u003c/span>\u003c/div>"}, {"id": "1789238899319", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the circle of Willis:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is in the suprasellar cistern.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The circle of Willis is complete in the majority of individuals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Intracranial cross flow of contrast agent can be tested by manual compression of one cervical carotid artery, while the other is injected with contrast medium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The pre-communicating (A1) segment of the anterior cerebral artery may be hypoplastic.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The largest of the perforating medial lenticulostriate branches is the Heubner’s recurrent artery usually arising from the proximal A2 segment.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- its distal territory in that case is supplied by the contralateral anterior cerebral artery via the anterior communicating artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this supplies the anterior limb of the internal capsule and parts of the caudate nucleus and globus pallidus.\u003c/span>\u003c/div>"}, {"id": "1789238899321", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the intracranial circulation:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The middle cerebral artery runs laterally through the Sylvian fissure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior cerebral arteries lie in close proximity to each other in the interhemispheric fissure. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The right and left posterior cerebral arteries are the first branches of the basilar artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The thalamostriate arteries are branches of the middle cerebral artery that supply the majority of the thalamus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The lateral surfaces of the frontal lobes are supplied by the anterior cerebral artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the basilar artery terminates by dividing into these.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- branches of the posterior cerebral artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- most of the lateral surfaces of the hemispheres are supplied by the frontal, parietal, angular, superior temporal branches of the middle cerebral arteries from which they arise in the insular.\u003c/span>\u003c/div>"}, {"id": "1789238899323", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the anatomic variants of the intracranial circulation:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The commonest variation of the circle of Willis involves the posterior communicating artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The hypoplastic anterior communicating artery may occur in 15-20% of individuals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Both anterior cerebral vessels may be supplied from one side in 2% of individuals.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The azygos artery runs in the interhemispheric fissure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The trigeminal artery may arise from the middle meningeal artery to supply the trigeminal and facial ganglia.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this vessel may be small in 22%, or may be large and associated with a reduced size of the proximal part of the ipsilateral posterior cerebral arteries and receives its supply from the middle cerebral artery in 15%. This is the fetal posterior communicating artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 3%.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the azygos artery is formed when the anterior cerebral arteries fuse approximately to form a single trunk in-between the hemispheres before dividing near the genu of the corpus callosum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this represents embryonic connections between the carotid and basilar arteries, which rarely persist into adulthood. The trigeminal artery, the commonest of these, arises from the internal carotid artery just before it enters the cavernous sinus and passes lateral to the dorsum sella to the upper basilar artery.\u003c/span>\u003c/div>"}, {"id": "1789238899325", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the intracranial venous anatomy:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The cortical veins are usually variable.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The superior sagittal sinus is roughly circular in cross-section.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Most of the flow in the superior sagittal sinus is directed to the left transverse sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Valves in the superior sagittal sinus maybe mistaken for thrombus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superior sagittal sinus may bifurcate well above its normal termination at the internal occipital protuberance. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- triangular in cross-section - hence a non-enhancing thrombus in this sinus gives the ‘empty triangle’ or ‘empty delta’ sign. The sinus usually begins near the crista galli, increases in size from the front backwards; it may not develop anterior to the coronal suture and mimics occlusion in this region.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- most of the flow is directed to the right transverse sinus. From the deep venous system blood flows into the left transverse sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the dural sinuses are valveless, trabeculated venous channels. Arachnoid granulations may appear as filling defects and cause confusion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the intervening space is mistaken for non-enhancing thrombus - falsepositive empty triangle or empty delta sign. \u003c/span>\u003c/div>"}, {"id": "1789238899327", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the dural venous sinuses:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The sigmoid sinuses are a continuation of the transverse sinuses on each side.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Prominent arachnoid granulations may show up as intraluminal filling defects in the transverse sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Erosive changes in the marginal petrous bone adjacent to the sigmoid sinus may be a normal variant.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>An occipital sinus is in the midline running from the foramen magnum towards the torcula.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The intercavernous sinuses are situated on either side of the pituitary fossa.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- there may be larger ‘cavernous nodules’ which may be seen as intraluminal filling defects.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this may be due to the pseudoerosive changes, and normal petromastoid aeration is a useful guide to this variant.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the sinus is not usually identified at angiography. At the foramen magnum it anastomoses with the marginal sinuses.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the paired cavernous sinuses are situated in the side of the pituitary fossa and they connect with each other through the intercavernous sinuses.\u003c/span>\u003c/div>"}, {"id": "1789238899329", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the cavernous sinus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It receives the superior and inferior ophthalmic veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>They communicate with the transverse sinuses via the inferior petrosal sinus on each side.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The internal carotid artery pursues an S-shaped course through the sinus before piercing its dural roof.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The third, fourth and divisions of the fifth cranial nerve run in separate dural tunnels in the lateral wall of the sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The abducent nerve lies inferior to the maxillary nerve in the cavernous sinus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- via the superior petrosal sinus on each side.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the internal carotid artery pierces the dural roof of the cavernous sinus medial to the anterior clinoid process.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they run in a common dural tunnel in the lateral wall of the sinus to reach the superior orbital fissure.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it lies free within the sinus applied to the lateral wall of the internal carotid artery.\u003c/span>\u003c/div>"}, {"id": "1789238899331", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the venous sinuses:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Meckel’s cave is a dural recess anterior to the cavernous sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The sphenoparietal sinus is a medial extension of the Sylvian vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The inferior petrosal sinus drains the cavernous sinus into the transverse sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The superior anastomotic vein of Trolard runs from the superficial middle cerebral (Sylvian) vein to the superior sagittal sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The venous angle is where the great cerebral vein joins the inferior sagittal and straight sinuses. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is posterior to the cavernous sinus and is occupied by the trigeminal ganglion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the Sylvian vein or the superficial middle cerebral vein forms an arc along the surface of the Sylvian fissure and is continuous with the sphenoparietal sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- into the jugular bulb which is a focal dilatation of the internal jugular vein at the jugular foramen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the inferior anastomotic vein of Labbe connects the superficial middle cerebral vein with the transverse sinuses.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the venous angle is the confluence of the thalamostriate and septal veins behind the interventricular foramen of Munro to form the internal cerebral vein. \u003c/span>\u003c/div>"}, {"id": "1789238899333", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 10", "q": "\u003cdiv class=\"stem\">Regarding the vertebrobasilar arterial system:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The most proximal and largest branch of the vertebral artery is the posterior inferior cerebellar artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior inferior cerebellar artery arises from the distal end of the vertebral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The superior cerebellar artery is related to the oculomotor nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The pre-communicating (P1) segment of the posterior cerebral artery extends from the basilar bifurcation to the origin of the inferior temporal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The ambient segment (P2) of the posterior cerebral artery courses around the cerebral peduncles above the tentorium.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the largest and most distal branch.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a branch of the basilar artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is a branch of the basilar artery near to its terminal division and comes to lie inferior to the oculomotor nerve, which separates it from the posterior cerebral artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the P1 segment extends from the basilar bifurcation to the origin of the posterior communicating artery.The thalamic perforating arteries, which arise from both the P1 segments and the posterior communicating artery, give extensive supply to the thalamus, hypothalamus, the third nerve and the fourth nerve and to the internal capsule.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the P2 segment may be compressed against the tentorial edge when there is uncal pressure on the midbrain in the event of raised intracranial pressure.Therefore, infarction of the occipital lobe is a recognized consequence.\u003c/span>\u003c/div>"}, {"id": "1789238899335", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding imaging methods of the eye and orbit:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Soft tissue structures of the orbit are shown well on CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The bony orbit and optic canal together with the adjacent osseous structures are best shown by MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The posterior segment of the optic nerve is satisfactorily shown by sonography.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Dacryocystography is usually done with injection of contrast medium into the superior canaliculi.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Fat suppression sequences on MRI are rarely helpful.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- these are best shown byfine section, bone algorithm CT. Plain films may show major fractures. Contents of the optic canal can be shown only by MRI.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the anterior part of the optic nerve can be shown by sonography, but CT or MRI is required for demonstration of the posterior segments. MRI reliably shows the internal structure of the non-expanded nerve and sheath.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- usually the inferior canaliculi.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>"}, {"id": "1789238899337", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the orbit:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Zygoma forms part of the medial wall.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The triangular floor of the orbit is formed only by the orbital process of the maxillary bones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The inferior orbital fissure separates the floor and the medial wall of the orbit.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lateral wall of the orbit is formed by the zygomatic bone and more posteriorly by the greater wing of the sphenoid.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superior wall or roof is formed by the orbital plate of the frontal bone and the lesser wing of the sphenoid. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the medial wall is formed from front to back by the following: the frontal process of the maxilla, the nasal bone, the lacrimal bone, the orbital plate of the maxilla, the ethmoid bone, the frontal bone, and at the apex the sphenoid bone contributes a small portion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is formed from medial to lateral by the orbital plate of the maxilla, and the zygomatic bone.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this separates the lateral wall from the floor of the orbit.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899339", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the orbit:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The optic canal is formed by the two roots of the lesser wing of the sphenoid bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The superior orbital fissure is a triangular slit between the greater and lesser wings of sphenoid.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The medial ends of the inferior and superior orbital fissures are closely related.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The inferior orbital fissure transmits a branch of the maxillary division of the fifth cranial nerve from the middle cranial fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The inferior orbital fissure extends from the middle cranial fossa into the orbit.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this transmits the first division of the fifth and third, fourth and sixth cranial nerves as well as the ophthalmic veins and the branch of the middle meningeal artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it transmits this nerve after it has passed from the middle cranial fossa into the pterygopalatine fossa via the foramen rotundum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inferior orbital fissure anteriorly forms an opening between the orbital cavity and the infra temporal fossa. More posteriorly it forms an opening between the orbit and the pterygopalatine fossa.\u003c/span>\u003c/div>"}, {"id": "1789238899341", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the eye:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The lacrimal artery may give rise to a recurrent branch which communicates with the middle meningeal artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The intra-orbital segment of the optic nerve is the shortest portion of the nerve.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Fat from the orbit may extend posteriorly into the cavernous sinus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Direct spread of tumour and infection from the sphenoid sinus to the optic canal may occur.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The blood supply to the optic chiasm is through the basilar artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is important because embolization of the middle meningeal artery can endanger the territory of the ophthalmic artery, which gives rise to the lacrimal artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is the longest of the four segments, which are intra-ocular, intraorbital, intracanalicular and intracranial. It measures about 3 cm in length.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the periosteum of the optic canal may be in direct contact with that of the sphenoid sinus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is through the anterior cerebral and internal carotid artery.The posterior cerebral artery gives branches to the lateral geniculate body, lower fibres of optic radiation and visual cortex. The middle cerebral artery gives branches to the upper fibres of optic radiations and inconsistently to the occipital poles.\u003c/span>\u003c/div>"}, {"id": "1789238899343", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding imaging methods of the ear:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>High resolution computerised tomography (HRCT) is the examination of choice for the contents of the internal auditory meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>HRCT is the technique of choice to look at the anatomy of the petrous temporal bone.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Contrast-enhanced CT is the technique of choice to image the cranial nerves in the cerebellopontine angle cistern.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Tomography should be used to assess the contour of the internal auditory canal.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The whole of the inner ear labyrinth is adequately demonstrated by HRCT. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- MRI is the examination of choice for the contents of the internal auditory meatus and the cerebellopontine angles cistern.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- MRI gives complementary information of the surrounding soft tissue structures including the facial and auditory nerves.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- MRI\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- superseded by CT and MRI.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the bony labyrinth of the inner ear is demonstrated by HRCT, and the membranous labyrinth is shown by MRI. \u003c/span>\u003c/div>"}, {"id": "1789238899345", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the development and anatomy of the ear:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>After birth the inner ear continues to grow and attains adult proportions by 2 years of age.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The bony labyrinth of the inner ear is the last structure of the cranium to ossify after birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Congenital variants of the middle and inner ear are usually associated.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lateral two-thirds of the external auditory meatus is cartilaginous.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The tympanic membrane is embedded in the bone of the tympanic ring.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inner ear is essentially of adult size and form at birth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- at birth the bony labyrinth is the only part of the cranium to have ossified fully.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the pinna, external auditory meatus and middle ear appear around the eighth week of gestation and arise from the first and second branchial arches. The inner ear develops with the formation of the optic capsule at about the third week of gestation. Therefore, congenital anomalies of the external ear and middle ear are commonly associated and those of the inner ear are usually isolated.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lateral one-third is cartilaginous and the medial two-thirds are osseous.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The superior portion of this ring is known as the scutum and is the lateral wall of the epitympanum.\u003c/span>\u003c/div>"}, {"id": "1789238899347", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the middle ear and mastoid:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The middle ear is housed in the petrous bone with the tympanic membrane laterally and inner ear medially.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The middle ear is divided into three divisions in the coronal plane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The aditus ad antrum is a communication from the attic of the middle ear to the middle cranial fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The promontory overlies the basal turn of the cochlea.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The oval window is behind and below the promontory.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the superior epitympanum or attic is separated by a thin layer of bone called tegmen tympanum from the middle cranial fossa. The mesotympanum and hypotympanum are the middle and inferior divisions which are formed by lines drawn along the superior and inferior margins of external auditory meatus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a communication between the attic and the mastoid air cells and is of importance as middle ear infection may spread to the mastoid air cells, which are related posterior to the sigmoid sinus and cerebellum in the posterior cranial fossa.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the oval window into which the base of the stapes inserts is above and behind the promontory.The round window, which is covered by membrane, is below and behind the promontory.\u003c/span>\u003c/div>"}, {"id": "1789238899349", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the middle ear:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The ossicular chain of malleus, incus and stapes connect the tympanic membrane with the round window.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The head of the malleus and the incudomalleal articulation are situated in the mesotympanum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The incus lies posterior to the malleus. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The incudomalleal and incudostapedial joints have synovial articulation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The Eustachian tube opens into the inner ear.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- connect the ossicles with the oval window.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- they are in the epitympanic recess.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- they are less prone to those diseases aﬀecting synovial joints elsewhere in the body.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lower part of the middle ear continues inferiorly with the Eustachian tube which opens into the lateral wall of nasal pharynx. This is bony at first and cartilaginous in its lower portion.\u003c/span>\u003c/div>"}, {"id": "1789238899351", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the inner ear:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The membranous labyrinth surrounds the bony labyrinth of the inner ear.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The cochlea contains the organ of Corti.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Each semi-circular canal is at about 45°to the other.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The membranous labyrinth is concerned with equilibrium.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The membranous labyrinth is of high signal intensity on T 1-weighted MRI.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the bony labyrinth surrounds the membranous labyrinth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- concerned with reception of sound.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- at right angles to the others, and the anterior and posterior canals lie in the vertical plane.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this contains fluid therefore has high signal intensity on T 2-weighted MRI. The saccule and utricle situated anteriorly and posteriorly within the vestibule cannot be resolved separately by MRI.\u003c/span>\u003c/div>"}, {"id": "1789238899353", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the internal auditory meatus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior wall of the internal auditory canal is shorter than the posterior.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The facial and vestibulocochlear nerves in the internal auditory meatus are best studied using T1-weighted MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The crista falciformis divides the internal auditory meatus vertically into two compartments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lamina cribrosa is at the medial end of the internal auditory meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The facial and vestibulocochlear nerves may form a single bundle as they cross the cerebellopontine angle cistern. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is true\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the meatus contains cerebrospinal fluid, is lined completely with dura and pia-arachnoid and transmits the facial and vestibulocochlear nerves and the labyrinthine artery, which enter its medial opening into the posterior fossa, the porus acousticus. In the majority of cases studied with axial high resolution T 2-weighted MRI the facial nerve can be seen separately anterior to the vestibulocochlear nerve.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the internal auditory meatus is divided by the horizontal crista falciformis and vertical crests into four compartments. The facial nerve and the intermediate nerve occupy the anterosuperior quadrant. The cochlear branch of the vestibulocochlear nerve occupies the antero-inferior quadrant. The superior and inferior vestibular branches of the vestibulocochlear nerve are found in the posterior quadrant.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lamina cribrosa is at the lateral end of the internal auditory meatus through which the facial nerve passes to enter the facial canal and the vestibulocochlear nerve which gives branches to the cochlea and vestibule.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- \u003c/span>\u003c/div>"}, {"id": "1789238899355", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the facial (seventh) nerve:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The intermediate nerve of the facial nerve is the large motor root.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The first labyrinthine segment of the facial nerve extends anteromedially from the internal auditory meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The greater superficial petrosal nerve arises from the geniculate ganglion.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The first genu of the facial nerve is directed posteriorly from the geniculate ganglion.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The mastoid segment is a continuation from the second genu of the facial nerve.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the facial nerve has a large motor and a small sensory root which is the intermediate nerve. This is too small to be identified either by cisternography or MRI.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the first segment of the facial nerve extends anterolaterally from the internal auditory meatus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it carries secretomotor fibres to the lacrimal gland and takes fibres to the palate.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the tympanic segment passes along the medial wall of the tympanic cavity beneath the lateral semi-circular canal. Therefore, this part of the facial nerve is vulnerable to inflammatory disease of the middle ear. Coronal CT through the cochlea shows the facial canal twice to produce ‘sna
