ke’s eyes’ appearance of the facial nerve above the cochlea.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the mastoid segment is directed inferiorly, and the nerve emerges from the skull base through the styloid foramen. This nerve transmits taste fibres from the anterior two-thirds of the tongue to the lingual nerve and the motor fibres to the submandibular and sublingual gland.\u003c/span>\u003c/div>"}, {"id": "1789238899357", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the cerebellopontine angle cistern:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The flocculus of the cerebellum forms the anterior boundary.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The facial and vestibulocochlear nerves lie here.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>It is roughly triangular in shape in the axial plane.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The labyrinthine artery may enter the internal auditory meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The anterior inferior cerebellar artery forms a meatal loop. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the cerebellopontine angle cistern is bounded by the posterior surface of the petrous bone laterally, the pons medially and the flocculus of the cerebellum posteriorly.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the flocculus lies closely to the anterior/inferior cerebellar artery and may become hyperdense in comparison with the remainder of the cerebellum. This should not be mistaken for an acoustic neurinoma.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the other structures in this cistern are the seventh, eighth cranial nerves, the anterior/inferior cerebellar artery and the trigeminal nerve.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the labyrinthine artery arises from the meatal loop of the anterior inferior cerebellar artery. On contrast-enhanced CT this may be mistaken for an acoustic neurinoma.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- . \u003c/span>\u003c/div>"}, {"id": "1789238899359", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding surface anatomy:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The nasion overlies the suture between the frontal and ethmoid bones.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A line joining the parietal eminence on each side forms the smallest transverse diameter of the skull.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The inion is the point lateral to the tip of the external occipital protuberance.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The lambda represents the posterior fontanelle in the newborn and is at the junction of the sagittal and lambdoid sutures.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The coronoid process of the mandible can be felt in front of the tragus.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the nasion overlies the suture between the frontal and nasal bones.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the line joining each parietal eminence forms the greatest transverse diameter of the skull.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inion is the point on the tip of the external occipital protruberance in the midline.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the condyloid process lies in front of the tragus and moves forwards and downwards if the mouth is opened. The coronoid process can be identified by placing a finger in the angle between the zygomatic arch and the masseter muscle.\u003c/span>\u003c/div>"}, {"id": "1789238899361", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the anatomy of the head and neck:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The parotid duct can be rolled across the anterior border of the masseter muscle just below the zygomatic bone, with teeth clenched.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The orifice of the parotid duct can be seen within the mouth at the level of the second upper premolar tooth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The mental foramen is found at the level of the two premolar teeth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The mental branch of the inferior alveolar nerve emerges from the mental foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The sternocleidomastoid has two heads at insertion.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the orifice of the parotid duct can be seen opposite the upper second molar tooth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the mental foramen is midway between the upper and lower borders of the body of the mandible at the level of the interval between the two premolar teeth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899363", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Concerning vertebral levels:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Atlas and dens of axis lie in the horizontal plane of the open mouth in an AP projection.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The hyoid bone lies at the level of the fifth cervical vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The lower border of the cricoid cartilage is at the level of the sixth cervical vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The upper border of the thyroid lamina is at the level of the fourth cervical vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The junction of the pharynx and the oesophagus is at the level of the sixth cervical vertebra. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- third cervical vertebra\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the common carotid artery bifurcates at this level\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- at this level is the junction of the larynx with the trachea. Also, the vertebral artery usually passes into the foramen transversarium of the cervical vertebra. \u003c/span>\u003c/div>"}, {"id": "1789238899365", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the head and neck:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The tongue receives innervation from nerves of the first, second, third and fourth pharyngeal arches.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The thyroid gland originates at the apex of the foramen caecum on the developing tongue.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>In the Water’s view (occipitomental) the petrous ridges should be projected just above the maxillary antra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Dolan’s three lines are useful to identify facial symmetry in the Cauldwell (occiptofrontal) view.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The lateral pterygoid muscle lies inferior and lateral to the medial pterygoid.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- just below the maxillary antra.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the Water’s view.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- bulk of lateral pterygoid is cranial to the medial pterygoid. Therefore, on axial images the lateral and medial pterygoid appear to be at the same level.\u003c/span>\u003c/div>"}, {"id": "1789238899367", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the head and neck:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pterygomaxillary fissure opens into the infratemporal fossa through the pterygopalatine fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The infratemporal fossa communicates with the nasal cavity through the sphenopalatine foramen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The foramen rotundum opens into the posterior wall of the infratemporal fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The mandibular nerve emerges from the foramen ovale.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The infratemporal fossa is inferior to the lesser wing of sphenoid.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the lateral opening of the pterygopalatine fossa into the infratemporal fossa is the pterygomaxillary fissure.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the pterygopalatine fossa opens into the nasal cavity through the sphenopalatine foramen.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it opens into the posterior wall of the pterygopalatine fossa and transmits the maxillary nerve.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- inferior to greater wing of sphenoid and behind the maxilla.\u003c/span>\u003c/div>"}, {"id": "1789238899369", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the mandible and the temporomandibular joint:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Each half of the body of the mandible is fixed anteriorly in the midline at the mental symphysis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The inferior alveolar nerve enters the mandibular canal through the mandibular foramen. * From Applied Radiological Anatomy: ‘Extracranial head and neck’. 162\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The TMJ has a fibrous articular disc, which separates the mandibular fossa of the temporal bone into lateral and medial compartments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The disc and the condyle move forward when the mouth is opened.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Arthrography is usually performed in only the inferior compartment.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- enters on the inner surface of the ramus and emerges on the outer surface through the mental foramen* From Applied Radiological Anatomy: ‘Extracranial head and neck’. 163\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- divides into larger inferior and smaller superior compartments, which do not communicate and function as separate joints.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the bilaminar zone - a loose posterior attachment of the condyle to the temporal bone permits this forward translation.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is done for joint function, to diagnose joint perforation and anterior dislocation. More recently, MRI is the technique of choice.\u003c/span>\u003c/div>"}, {"id": "1789238899371", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">In the nose:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The hiatus semilunaris is situated beneath the ethmoid bulla in the middle meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The sphenopalatine foramina lie behind the superior meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The nasal mucosa is usually symmetrical on MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The main blood supply to the nasal cavity is from the sphenopalatine branch of the maxillary artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Little’s area is the antero-inferior aspect of the nasal septum.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- ethmoid, maxillary and frontal sinuses drain into the hiatus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- serves as a conduit for infection or neoplasm to spread into the orbit or cranial cavity.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- periodic vascular engorgement results in opening and closing of alternate sides of the nasal airway every 2-3 hours.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the rich blood supply of the nasal cavity derives from both internal and external carotid systems. The anterior ethmoidal branches of the ophthalmic artery joins the anastomotic network in the nasal septum. Little’s area is the most common site of epistaxis.\u003c/span>\u003c/div>"}, {"id": "1789238899373", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 11", "q": "\u003cdiv class=\"stem\">Regarding the paranasal sinuses:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The frontal sinuses are present at birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Hypoplasia of maxillary sinus may be seen in up to 10% of normal population, and is seen as high density on plain radiographs.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ostiomeatal complex is the final common pathway for drainage of secretions from the maxillary, frontal and anterior and middle ethmoid sinuses into the middle meatus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The greater and lesser wings of sphenoid usually pneumatize.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The anterior midline septum of the sphenoid sinus may be deviated to one side posteriorly.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- traces of sphenoid and maxillary sinus are present in the neonate. All other sinuses become evident at about 7 or 8 years.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- not to be confusd with inflammation when seen on a plain radiograph.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- its identification is important prior to trans-sphenoidal surgery.\u003c/span>\u003c/div>"}, {"id": "1789238899375", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the salivary glands:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The parotid gland lies beneath the ramus of the mandible.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The parotid gland typically has an attenuation similar to that of muscle on CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Stenson’s duct runs deep to the masseter muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The submandibular gland has a similar attenuation to the parotid on CT.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The digastric muscle divides the submandibular gland into superficial and deep portions. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- lies over the ramus of the mandible and masseter muscle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the attenuation is between fat and muscle.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- runs superficial to the masseter and turns medially, pierces the buccinator to open opposite the second upper molar tooth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- higher than that of parotid gland.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- mylohyoid divides the gland into superficial and deep portions. The digastric muscle divides the gland into its anterior and posterior portions. \u003c/span>\u003c/div>"}, {"id": "1789238899377", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the pharynx:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It extends from the base of the tongue to the level of C6.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The pharyngobasilar fascia at the level of the nasopharynx is deficient as the sinus of Morgagni.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>On axial CT and MRI the fossa of Rosenmuller is lateral to the torus tubarius.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The palatine tonsils are between the palatoglossal and palatopharyngeal folds.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The tonsils and adenoids have a high signal on T2-W MRI.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the base of the skull to the lower border of the cricoid cartilage at the level of C6, where it becomes continuous with the oesophagus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this serves as a potential conduit for neoplastic or inflammatory process to reach the skull base.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the fossa of Rosenmuller (the site of origin of up to 50% of nasopharyngeal carcinomas) is posterior and medial to the opening of the auditory tube.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899379", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the larynx:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The epiglottis arises from the cricoid cartilage.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The piriform fossa lies between the aryepiglottic fold and the thyroid cartilage.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The arytenoid cartilage alters the tension of the vocal cords and the shape of the glottis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The paraglottic space terminates below the cricoid cartilage.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The pre-epiglottic space lies between the base of the tongue and the epiglottis.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the thyroid cartilage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the cricoid cartilage articulates with the thyroid and arytenoid through synovial joints. Therefore, these joints are susceptible to systemic arthropathies such as rheumatoid disease.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the paraglottic spaces lie deep to the false and true cords. They contain fat and terminate at the upper border of the cricoid cartilage. Therefore there is no soft tissue within the cricoid ring.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- between the epiglottis and hyoid bone.\u003c/span>\u003c/div>"}, {"id": "1789238899381", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the fascial layers of the neck:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The superficial cervical fascia is subcutaneous and extends into the thorax inferiorly.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The superfical or investing layer of the deep cervical fascia envelopes the parotid and submandibular gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle or visceral layer of the deep cervical fascia lies deep to the strap muscles of the neck.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The deep or prevertebral layer surrounds the brachial plexus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The carotid sheath receives contribution from only the middle layer of the deep cervical fascia.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and completely encircles the head and neck.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and extends to clavicles, sternum and scapulae.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- invests the trachea, oesophagus and surrounds the thyroid gland.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the vertebrae, paraspinal muscles. It extends from the skull base to the superior mediastinum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from all three layers of the deep cervical fascia.\u003c/span>\u003c/div>"}, {"id": "1789238899383", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">The parapharyngeal space:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>appears hyperintense on T1-W MRI.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>is one of the commonest sites for primary pharyngeal tumours \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>contains the maxillary artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>is bounded anteriorly by the buccinator space.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>is bounded medially by the parotid space.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- ‘high-signal fatty triangle’.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it is characteristically infiltrated, displaced by surrounding masses. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and the ascending pharyngeal artery, pharyngeal venous plexuses, mandibular nerve branches and fat.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- See the corrected statement above.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- laterally by the parotid space, posteriorly by the carotid sheath, medially by the pharyngeal mucosal space, anteriorly by the masticator space.\u003c/span>\u003c/div>"}, {"id": "1789238899385", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the thyroid and parathyroid glands:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The pyramidal lobe extends superiorly from the left lobe.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The left lobe is usually larger than the right.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The follicular nature of the thyroid is resolved by high frequency ultrasonographic examination.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>99mTc pertechnetate imaging provides functional data on the thyroid gland.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The thyroid derives its blood supply from the external and internal carotid systems.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- extends from the isthmus in the midline in 40% of subjects.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the opposite is true. The right lobe is more vascular than the left and tends to enlarge more in diﬀuse disorders.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the thyroid appears relatively homogeneous in texture and relatively hyperechoic to the superficial sternocleidomastoid muscles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 99mTc is not metabolized in the thyroid. However,123I is both trapped and organified, and functional data can be obtained. 99mTc provides morphological information and will reveal the presence of ectopic thyroid tissue.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the paired superior thyroid and inferior thyroid arteries are from the external carotid and thyrocervical trunk (subclavian artery) respectively. The thyroidea ima is an occasional branch of the brachiocephalic trunk on the aortic arch, which supplies the inferior portion of the right lower lobe.\u003c/span>\u003c/div>"}, {"id": "1789238899387", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the external carotid artery and its branches:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The ascending pharyngeal artery ascends between the internal and external carotid artery on the posterolateral wall of the pharynx.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The first branch is the lingual artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The facial artery contributes to connections between the external carotid and internal carotid arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The occipital artery anastomoses with branches of the vertebral artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The superficial temporal and posterior auricular arteries are the two terminal branches of the external carotid artery. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- an important artery in interventional radiology, it participates in extensive anastomoses with other branches of the external carotid artery, cavernous branches of the internal carotid artery and meningeal branches of the vertebral artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- superior thyroid artery is the first branch.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- anastomoses with branches of the ophthalmic artery (branch of the internal carotid artery).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- also sends meningeal branches to the dura of the posterior fossa.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- superficial temporal and maxillary arteries. \u003c/span>\u003c/div>"}, {"id": "1789238899389", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the maxillary artery and its branches:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The maxillary artery passes anteriorly from the parotid gland through the infratemporal fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The maxillary artery lies deep to the temporalis muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle meningeal artery enters the anterior cranial fossa.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The superficial temporal artery is usually a straight structure.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The anterior deep temporal artery is a branch of the second part of the maxillary artery.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- 15 terminal branches are given oﬀ anterior to the pterygopalatine ganglion.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- enters the middle cranial fossa through the foramen spinosum. The anterior division is prone to damage in fractures of the skull, giving rise to an extradural haematoma.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this artery has a ‘corkscrew’ appearance compared with the relatively straight branches of the maxillary artery, which enables its easy identification on a lateral angiogram.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the branches from the second part of the maxillary artery supply muscles of mastication. The anterior deep temporal artery anastomoses with orbital vessels forming another potential external to internal carotid arterial connection.\u003c/span>\u003c/div>"}, {"id": "1789238899391", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding ultrasonography of the carotid arteries:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>In a B-mode study, the wall of the normal carotid artery produces two parallel echopoor layers with a hyperechoic strip between them.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The Doppler flow study measures the velocity of blood flowing through the arteries.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The common carotid arterial Doppler trace resembles that of the external carotid artery.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The internal carotid artery supplies a high resistance circulation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Flow reversal at the bulb of the bifurcation of the common carotid artery is a normal feature.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it produces two parallel echoes, which represent the intima and adventitia with the intervening echopoor layer of the media.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and also provides information on direction and flow characteristics.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 70% of common carotid arterial blood flow is directed towards the brain. Therefore the common carotid arterial Doppler resembles that of the internal carotid artery.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it supplies a capacitance circulation with low total peripheral resistance.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899393", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding venous drainage of the head and neck:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The retromandibular vein drains into the external jugular vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The facial veins communicate with the cavernous sinus through the ophthalmic veins.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The external jugular vein drains into the internal jugular vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The retromandibular vein is joined by the occipital vein to form the external jugular vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The internal jugular vein has no valves. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- drains into the subclavian vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- retromandibular vein is joined by the posterior auricular vein to form the external jugular vein. The occipital vein drains into the internal jugular vein.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it has valves just above the inferior bulb, which may prove diﬃ cult to pass with a guidewire. \u003c/span>\u003c/div>"}, {"id": "1789238899395", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the brachial plexus:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>It is formed from the anterior rami of the fifth cervical to the first thoracic nerve roots.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The upper trunk lies between the scalenus anterior and medius muscles.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The middle trunk lies beneath the scalenus anterior muscle.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The five nerve roots eventually give rise to five nerves.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The cords of the brachial plexus form above and behind the pectoralis minor muscle. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the fourth cervical and second thoracic roots may also contribute.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it is formed by the fifth and sixth cervical roots.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the middle trunk is formed by the seventh cervical root. The eighth cervical and first thoracic roots unite behind scalenus anterior to form the lower trunk.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- and surround the axillary artery, run between the clavicle and first rib to enter the axilla, where they divide into their terminal branches. \u003c/span>\u003c/div>"}, {"id": "1789238899397", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding imaging of the spine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The attenuation of fat is higher than that of cerebrospinal fluid on computerized tomography.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Following administration of intravenous iodinated contrast medium, the spinal cord and nerve roots enhance.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Bone and soft tissue is visualized using a window level of 40 HU and a width of 300 HU.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>CT myelography shows changes in spinal cord substance.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On T 2-W sequence CSF is of higher signal than neural structures and ligaments.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- CSF and water have an attenuation of about zero Hounsfield units - fat is radiolucent and has a lower attenuation of about /H1100260 to /H11002100 and appears darker than CSF.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- following contrast, the spinal cord, nerve roots and intervertebral discs do not enhance. The spinal meninges, dorsal root ganglia and blood vessels enhance.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- separate window settings are required to visualize bone and soft tissue as follows: Bone (level 200 HU and width of 1500 HU); Soft tissue (level 40 HU and width 300 HU).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- shows any alteration in contour. MRI shows changes in spinal cord substance.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- T 2-W images have a myelographic eﬀect.\u003c/span>\u003c/div>"}, {"id": "1789238899399", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Concerning the vertebral column and the vertebra:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>Cervical and lumbar lordoses are primary curves present at birth.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior column is formed by the posterior longitudinal ligament and the neural arch.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The pedicles fuse laterally to form the spinous processes.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>Transverse process arises from the lateral aspect of the vertebral bodies.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The pars interarticularis is the part of the lamina between the superior and inferior articular facets. * From Applied Radiological Anatomy: ‘The vertebral and spinal column’. 174\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the thoracic and pelvic kyphoses are primary curves present in fetal life. The cervical and lumbar lordoses are secondary which develop after birth.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the vertebral column is a three-column structure. Anterior - anterior longitudinal ligament, anterior annulus fibrosus and anterior part of the vertebral body; middle - posterior longitudinal ligament and posterior annulus fibrosus on each side; posterior - neural arch and posterior longitudinal ligamentous complex including the interspinuos ligament.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the posterior neural arch contains laterally the pedicles on each side. The laminae are posterior and fuse to form the spinous process.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from the junction of the pedicle and the lamina. The articular processes project superiorly and inferiorly from the junction of the pedicle and lamina.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a pars defect is a spondylolysis, which may cause spondylolisthesis of the vertebral body. * From Applied Radiological Anatomy: ‘The vertebral and spinal column’. 175\u003c/span>\u003c/div>"}, {"id": "1789238899401", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the intervertebral disc:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The intervertebral disc forms a secondary cartilaginous joint between adjacent vertebrae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterolateral portion of the disc is not reinforced by the posterior longitudinal ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The nucleus pulposus is a gelatinous structure containing type II collagen.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The annulus fibrosus has internal and external components which insert into the hyaline cartilage and around the cartilaginous plate beyond the vertebral margins, respectively.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The disc is vascular throughout adult life.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- joint surfaces are lined by hyaline cartilage with an intervening fibrocartilage disc.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- hence many lumbar disc prolapses arise from this region.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- a remnant of the notochord, it contains up to 90% water and acts as a shock absorber. With increasing age, the disc undergoes progressive dehydration with loss of height and is replaced byfibrocartilage by 80 years of age.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the external annulus has thick fibres containing ‘type I’ collagen similar to fibrocartilage.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the rich blood supply to the discs present in infants and children decreases after puberty. By the age of 20 the normal disc is avascular.\u003c/span>\u003c/div>"}, {"id": "1789238899403", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">In the spine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The internuclear cleft develops during fetal life to diﬀerentiate into the central nucleus pulposus and the peripheral annulus fibrosus.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The cortical compact bone is the weight-bearing component of the body of the vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The red marrow of children appears hyperintense on T1-W MRI sequences compared with yellow marrow.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The external annulus is hypointense on both T1- and T2-W MRI sequences.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The internuclear cleft is seen as a hypointense transverse band across the mid-portion of the disc on MRI.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- in the second or third decade an internuclear cleft develops, which represents compacted collagenous fibres oriented transversely, due to invagination of the inner annular lamellae.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the vertebral body consists of a mass of cancellous bone surrounded by a cortical rim of compact bone. The cancellous bone has vertical (weightbearing) and horizontal trabeculae.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the red marrow of children appears relatively hypointense on T 1-W sequences. Following intravenous gadolinium, it enhances on T1-W sequences.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899405", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Concerning ligaments of the vertebral column:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The anterior longitudinal ligament extends from the basiocciput to the anterior surface of the upper sacrum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The posterior longitudinal ligament extends from the axis to the sacrum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The anterior longitudinal ligament is more firmly attached to the intervertebral disc than to the vertebral bodies.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The supraspinous ligament joins the tips of adjacent spinous processes from C1 to the sacrum.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The ligamentum flavum is elastic and has a slightly higher intensity on T 1-W MRI compared to the other spinal ligaments. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- above the axis it continues as the tectorial membrane.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the posterior longitudinal ligament is firmly attached to the discs and is separated from the vertebral bodies by the emerging basivertebral vein and epidural venous plexuses. The anterior longitudinal ligament is attached firmly to the vertebral bodies and less firmly to the discs.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- it extends from C7 to the sacrum. Above C7 it continues as ligamentum nuchae and inserts into the external occipital protuberance.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- it can extend by up to 35% of its length on flexion. \u003c/span>\u003c/div>"}, {"id": "1789238899407", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">In the spine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The facet joints are synovial joints.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The facet joints are the largest in the lowest two lumbar vertebrae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The cervical intervertebral foramen is orientated laterally.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The inferior articular process of the vertebra above is anterior to the superior articular process of the vertebra below.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The cervical vertebral bodies are supplied by segmental branches from the aorta.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the intervertebral discs are symphyses; between the laminae, transverse and spinous processes are fibrous joints (syndesmoses).\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this is where the maximum weight is borne by the vertebral column.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- orientated anterolaterally at 45°to the sagittal plane and is thus demonstrated using an oblique radiographic projection. In the thoracic and lumbar regions they are orientated laterally, and lateral radiographs are appropriate to demonstrate them.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the inferior articular process of the vertebra above is posterior to the superior articular process of the vertebra below. On axial section at the level of the facet joint the superior articular facet is anterior to the joint.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the atlas and axis vertebrae are supplied by the ascending pharyngeal and occipital arteries. The other cervical vertebrae are supplied by segmental branches from the costocervical, thyrocervical trunks and vertebral arteries. The thoracic and lumbar parts of the vertebral column are supplied by segmental aortic branches.\u003c/span>\u003c/div>"}, {"id": "1789238899409", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding vertebral venous plexuses:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The internal venous plexus runs in the body of the vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The external plexus consists of the anterior and posterior compartments.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The internal venous plexus communicates through the foramen magnum with occipital and basilar sinuses.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In the cervical region the external venous plexus communicates freely with occipital and deep cervical vein.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On MRI the course of the basivertebral vein is seen as a signal void.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is a plexus of thin-walled, valveless veins in the vertebral canal that surrounds the dura mater of the spinal cord and the posterior longitudinal ligament. The basivertebral vein runs in the body of the vertebra and drains into the internal plexus.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- anterior to the vertebral bodies and posterior to the spinous processes, respectively.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- due to slow venous flow and perivenous fat, the course of the vein is shown as high signal.\u003c/span>\u003c/div>"}, {"id": "1789238899411", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Regarding the vertebrae:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The ossification centres appear at the eighth week of gestation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The vertebral column ossifies in hyaline cartilage.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>There are three primary ossification centres for a typical vertebra. \u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The neurocentral joints (synchondroses) between the centrum and each half of the neural arch fuse by 7 years of age.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Failure of fusion of the neural arches with the centrum results in spina bifida.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- one in the centrum; one for each half of the neural arch. There are two ossification centres in the centrum, which fuse. Failure of one-half of this ossification centre to develop results in a hemivertebra. \u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the arches unite first in the lumbar region and last in the cervical. The centrum unites first with the arch in the cervical region and in the lumbar region last.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- failure of fusion of the neural arches posteriorly results in spina bifida . Up to 20% of the population have defects in the lumbosacral region.\u003c/span>\u003c/div>"}, {"id": "1789238899413", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 12", "q": "\u003cdiv class=\"stem\">Concerning the craniovertebral junction:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The atlas has no vertebral body.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The arcuate foramen is a defect in the posterior arch of the atlas.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The atlas is the strongest of the cervical vertebrae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The dens of the axis develops entirely from two primary ossification centres.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The dens has more compact bone than the body of the axis.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the vertebral artery runs in a groove over the superior aspect of the posterior arch of the atlas. Between the groove and the lateral mass is the attachment for the posterior atlanto-occipital membrane, which may occasionally calcify laterally. This creates the arcuate foramen when the vertebral artery and sub-occipital nerve pass through.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the axis (second cervical vertebrae) is the strongest of the cervical vertebrae.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- the tip of the dens develops from secondary centres at 3 years and fuses at 12 years. The dens unites with the rest of the body of the axis at 3 years.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the dens has a lower signal intensity than the body on T 1-W MRI.\u003c/span>\u003c/div>"}, {"id": "1789238899415", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">Concerning the craniovertebral junction:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>A separation of up to 5 mm in the alignment of the lateral borders of the lateral masses of the atlas and axis vertebra in adults is acceptable.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>Disruption of Harris’ ring indicates a fracture on a lateral cervical spine radiograph.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The transverse ligament is anterior to the tectorial membrane and passes behind the dens.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The apical ligament passes superiorly and inferiorly to the basiocciput and body of the axis, respectively, from the midpoint of the transverse ligament.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Rotation of the head occurs at the atlanto-occipital joint. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- 2 mm in adults: 3 mm in children.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- on a lateral cervical spine radiograph, it is formed anteriorly by the pedicle and anterior body of axis; posteriorly by the vertebral body; superiorly by the upper margin of the superior articular facet; inferiorly by the inferior border of foramen transversarium.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- holds the median atlantoaxial joint.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- this is the cruciform ligament. The apical ligament passes from the dens to the anterior mid point of the foramen magnum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- flexion, extension and lateral flexion take place at the atlanto-occipital joint. However, rotation occurs at the atlanto-axial joint around the vertical axis of the dens. \u003c/span>\u003c/div>"}, {"id": "1789238899417", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">On a lateral cervical spine radiograph:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>No more than 15 mm of the dens should be above the Chamberlain’s line.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The anterior atlanto-axial distance should be less than 3 mm in adults in flexion-extension or in a neutral position.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>Tonsillar descent of 3-5 mm into the spinal canal is a normal feature.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>In adults from the atlas to the C4/5 disc the maximum dimension of the prevertebral soft tissue is 3 mm (with a film-target distance of 180 cm)\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>On flexion and extension views, the oﬀset from adjacent vertebrae seen in the posterior and anterior cortical margins, respectively, should not exceed 3 mm.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- no more than a third of the dens or 5 mm of the dens should be above the Chamberlain’s line. This line extends from the hard palate to the posterior lip of the foramen magnum. The McGregor line uses the inferior surface of the occiput rather than the foramen magnum.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- less than 5 mm in children, with a target to film distance of 180 cm.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- not in a lateral cervical radiograph, but in a midline sagittal MRI of the craniovertebral junction,tonsillar descent of 3-5 mm into the spinal canal is a normal feature.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- in children this may be up to 7 mm. Below this level the oesophagus increases the dimensions to up to 22 mm in adults, and in the lower cervical spine this dimension should not exceed that of the adjacent vertebral body.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>"}, {"id": "1789238899419", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">In the spine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The facet joints of the thoracic spine up to T10 are in the coronal plane and resist anterior translation.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>The ‘collar of the Scotty dog’ on an oblique radiograph of the lumbar spine is the pars interarticularis.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The interpedicular distance increases progressively caudally.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The articular facets of the lumbar vertebra face each other in the sagittal plane apart from the inferior facet of L5.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>Lumbarization of the first sacral segment is less common than sacralization of fifth lumbar vertebra.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the head is the transverse process, eye the pedicle, the ear is the superior articular process and the front limb of the ‘dog’ is the inferior articular facet, all of which belong to one vertebra.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- this prevents forward translation on the sloping surface of the sacrum - L5 is an atypical vertebra.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- failure of segmentation at the lumbosacral level is seen in up to 6% of normal individuals.\u003c/span>\u003c/div>"}, {"id": "1789238899421", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">The spinal cord:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>extends in the adult from foramen magnum to the first or second lumbar vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>segments diﬀer by up to five in the lower thoracic region.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>tapers into the conus medullaris.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>has a lumbar expansion at the level of L1 to L5 vertebra.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>the anterior horns of the spinal cord contains the cell bodies of the motor neurones. \u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- diﬀerence of one segment in lower cervical spine; two segments in upper thoracic and three in the lower thoracic.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- from T10 to L1 vertebral levels the nerve roots emerge.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- posterior horns contain the cells of the sensory pathways. \u003c/span>\u003c/div>"}, {"id": "1789238899423", "deck": "MCQ Companion to Applied Radiological Anatomy / Chapter 13", "q": "\u003cdiv class=\"stem\">In the spine:\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(a)\u003c/span>The first to the seventh cervical spinal nerves exit below the pedicle of the corresponding vertebrae.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(b)\u003c/span>A postero-lateral prolapse of the L4/5 disc usually compresses the fifth lumbar root.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(c)\u003c/span>The ventral and dorsal roots pass in front of and behind the denticulate ligament, respectively.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(d)\u003c/span>The spinal dura mater is a continuation of the inner layer of the cerebral dura.\u003c/div>\u003cdiv class=\"opt\">\u003cspan class=\"letter\">(e)\u003c/span>The spinal dural sac is firmly attached to the anterior longitudinal ligament.\u003c/div>", "a": "\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(a)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- there are eight cervical, twelve thoracic, five lumbar, five sacral and one coccygeal segmental nerves.The first to the seventh cervical spinal nerves exit above the pedicle of the corresponding vertebrae, whereas all the other roots exit below the pedicles.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(b)\u003c/span>\u003cspan class=\"false\">False\u003c/span> \u003cspan class=\"explain\">- fourth lumbar root. However, a similar situation in the cervical vertebra would compress the fifth cervical root.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(c)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- The statement is correct as written.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(d)\u003c/span>\u003cspan class=\"true\">True\u003c/span> \u003cspan class=\"explain\">- the epidural (extradural) space is between the periosteum of the vertebrae (which represents the outer periosteal layer of the dura) and the spinal dura mater.\u003c/span>\u003c/div>\u003cdiv class=\"ans\">\u003cspan class=\"letter\">(e)\u003c/span>\u003cspan class=\"fal
